// ===== Confirmaciones en línea =====
function pedirConfirmacion(tarjeta, opciones) {
  var acciones = tarjeta.querySelector('.acciones');
  var original = acciones.innerHTML;

  acciones.innerHTML =
    '<div class="confirmacion">' +
      '<p>' + esc(opciones.pregunta) + '</p>' +
      (opciones.conNota ? '<textarea placeholder="' + esc(opciones.placeholder || 'Nota para el autor (opcional). Se incluye en el correo.') + '"></textarea>' : '') +
      '<div class="fila-botones">' +
        '<button class="boton ' + (opciones.peligro ? 'peligro-lleno' : 'principal') + '" data-confirmar type="button">' + esc(opciones.boton) + '</button>' +
        '<button class="boton secundario" data-cancelar type="button">Cancelar</button>' +
      '</div>' +
    '</div>';

  var area = acciones.querySelector('textarea');
  if (area) area.focus();

  acciones.querySelector('[data-cancelar]').onclick = function () { acciones.innerHTML = original; };
  acciones.querySelector('[data-confirmar]').onclick = function () {
    var nota = area ? area.value.trim() : '';
    if (opciones.notaObligatoria && !nota) { area.focus(); avisar('Escribe el motivo.', true); return; }
    var hecho = ejecutar(acciones, opciones.accion(nota), opciones.recargar);
    if (opciones.despues) hecho.then(opciones.despues);
  };
}

function ejecutar(contenedor, promesa, pestanaARecargar) {
  contenedor.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
  accionesEnCurso++;
  return promesa
    .then(function (r) {
      accionesEnCurso--;
      avisar(typeof r === 'string' ? r : (r && r.mensaje) || 'Listo.');
      return cargar(pestanaARecargar);
    }, function (err) {
      accionesEnCurso--;
      throw err;
    })
    .catch(function (err) {
      avisar(mensajeError(err), true);
      contenedor.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
    });
}

// ===== Eventos =====
document.addEventListener('click', function (e) {
  var pestana = e.target.closest('.pestana');
  if (pestana) {
    estado.pestana = pestana.getAttribute('data-pestana');
    pintar();
    return;
  }

  // IMPORTANTE: va antes que .filtro, porque el botón comparte esa clase y el filtro lo capturaba (dejaba el filtro vacío)
  if (e.target.closest('[data-quitar-periodo]')) {
    estado.periodo[estado.pestana] = { desde: '', hasta: '' };
    pintar();
    return;
  }

  var filtro = e.target.closest('.filtro');
  if (filtro) {
    var p = estado.pestana;
    var anterior = estado.filtro[p];
    estado.filtro[p] = filtro.getAttribute('data-filtro');
    if (p === 'comentarios' && anterior !== estado.filtro[p]) {
      estado.datos.comentarios = null;
      pintar();
      cargar('comentarios');
    } else {
      pintar();
    }
    return;
  }

  var boton = e.target.closest('[data-accion]');
  if (!boton) return;
  var accion = boton.getAttribute('data-accion');
  var tarjeta = boton.closest('.tarjeta');

  if (accion === 'ver-mas') {
    var texto = boton.previousElementSibling;
    texto.classList.toggle('recortado');
    boton.textContent = texto.classList.contains('recortado') ? 'Ver completo' : 'Ver menos';
    return;
  }

  // --- Solicitudes ---
  if (accion === 'aprobar-solicitud' || accion === 'rechazar-solicitud') {
    var fila = Number(tarjeta.getAttribute('data-fila'));
    var firma = tarjeta.getAttribute('data-firma');
    var aprobar = accion === 'aprobar-solicitud';
    pedirConfirmacion(tarjeta, {
      pregunta: aprobar ? '¿Aprobar? Se enviará al autor el formulario para entregar su artículo.' : '¿Rechazar esta solicitud? Se le avisará por correo.',
      boton: aprobar ? 'Sí, aprobar' : 'Sí, rechazar',
      peligro: !aprobar,
      conNota: !aprobar,
      notaObligatoria: !aprobar, // DEF-014
      placeholder: 'Motivo del rechazo (obligatorio). Se incluye en el correo al autor.',
      recargar: 'solicitudes',
      accion: function (nota) {
        return aprobar ? llamar('aprobarSolicitud', fila, firma) : llamar('rechazarSolicitud', fila, firma, nota);
      }
    });
  }

  // --- Artículos ---
  if (accion === 'publicar-articulo' || accion === 'rechazar-articulo') {
    var filaA = Number(tarjeta.getAttribute('data-fila'));
    var post = tarjeta.getAttribute('data-post');
    var publicar = accion === 'publicar-articulo';
    var selector = tarjeta.querySelector('[data-seccion]');
    var seccion = selector ? selector.value : '';
    var pendiente = tarjeta.querySelector('[data-chip-input]');
    if (pendiente && pendiente.value.trim()) agregarEtiqueta(pendiente);
    var campoEtq = tarjeta.querySelector('[data-etiquetas]');
    var etiquetasExtra = campoEtq ? campoEtq.value : '';

    if (publicar && !seccion) {
      selector.closest('.campo-seccion').classList.add('con-error');
      selector.focus();
      avisar('Elige la sección del blog antes de publicar.', true);
      return;
    }
    if (selector) selector.closest('.campo-seccion').classList.remove('con-error');

    pedirConfirmacion(tarjeta, {
      pregunta: publicar ? '¿Publicar en «' + seccion + '»? Será visible para todos y se avisará al autor.' : '¿Rechazar? Se borrará el borrador de Blogger y se avisará al autor.',
      boton: publicar ? 'Sí, publicar' : 'Sí, rechazar',
      peligro: !publicar,
      conNota: !publicar,
      recargar: 'articulos',
      accion: function (nota) {
        return publicar ? llamar('publicarArticulo', filaA, post, seccion, etiquetasExtra) : llamar('rechazarArticulo', filaA, post, nota);
      }
    });
  }

  if (accion === 'vincular-articulo') {
    var selFolio = tarjeta.querySelector('[data-folio]');
    var folioElegido = selFolio ? selFolio.value : '';
    if (!folioElegido) {
      if (selFolio) { selFolio.closest('.campo-seccion').classList.add('con-error'); selFolio.focus(); }
      avisar('Elige la solicitud a la que pertenece.', true);
      return;
    }
    ejecutar(tarjeta.querySelector('.acciones'), llamar('vincularArticulo', Number(tarjeta.getAttribute('data-fila')), folioElegido), 'articulos');
  }

  if (accion === 'descartar-articulo') {
    var filaD = Number(tarjeta.getAttribute('data-fila'));
    pedirConfirmacion(tarjeta, {
      pregunta: '¿Descartar este envío? Se le avisará al autor.',
      boton: 'Sí, descartar',
      peligro: true,
      conNota: true,
      recargar: 'articulos',
      accion: function (nota) { return llamar('descartarArticulo', filaD, nota); }
    });
  }

  if (accion === 'eliminar-articulo') {
    var filaE = Number(tarjeta.getAttribute('data-fila'));
    var postE = tarjeta.getAttribute('data-post');
    var tituloE = (tarjeta.querySelector('h3') || {}).textContent || 'este artículo';
    pedirConfirmacion(tarjeta, {
      pregunta: '¿Eliminar «' + tituloE + '» del blog? Dejará de verse para todos y no se puede deshacer.',
      boton: 'Sí, eliminar',
      peligro: true,
      conNota: true,
      placeholder: 'Motivo (opcional, solo lo ve el CIAD).',
      recargar: 'articulos',
      accion: function (motivo) { return llamar('eliminarArticuloPublicado', filaE, postE, motivo); }
    });
  }

  if (accion === 'eliminar-copia') {
    var filaK = Number(tarjeta.getAttribute('data-fila'));
    var postK = tarjeta.getAttribute('data-post');
    pedirConfirmacion(tarjeta, {
      pregunta: '¿Eliminar esta copia? Se borra de Blogger y del panel. No se avisa a nadie y la nota original no cambia.',
      boton: 'Sí, eliminar copia',
      peligro: true,
      conNota: false,
      recargar: 'articulos',
      accion: function () { return llamar('eliminarCopia', filaK, postK); }
    });
  }

  if (accion === 'eliminar-comentario') {
    var idE = tarjeta.getAttribute('data-id');
    pedirConfirmacion(tarjeta, {
      pregunta: '¿Eliminar este comentario? Se borra definitivamente y no se puede deshacer.',
      boton: 'Sí, eliminar',
      peligro: true,
      conNota: false,
      recargar: 'comentarios',
      accion: function () { return llamar('eliminarComentario', idE); }
    });
  }

  if (accion === 'reconvertir-articulo') {
    var filaR = Number(tarjeta.getAttribute('data-fila'));
    var postR = tarjeta.getAttribute('data-post');
    var tituloR = (tarjeta.querySelector('h3') || {}).textContent || 'este artículo';
    var artR = estado.datos.articulos.filter(function (x) { return x.fila === filaR; })[0] || {};
    pedirConfirmacion(tarjeta, {
      pregunta: (artR.editada ? '⚠ Esta nota se editó en el panel (' + artR.editada + '): la ficha del autor y el texto que se corrigieron ahí se perderán; ' +
        'el título y el subtítulo editados sí se conservan. ' : '') + '⚠ Opción en pruebas (todavía en desarrollo): revisa la nota después. ¿Rehacer la entrada «' + tituloR + '» desde el Word original? Se borra el texto, las imágenes y el formato que tiene ahora en Blogger ' +
        'y se vuelven a crear leyendo el Word. Los cambios hechos a mano en Blogger se pierden. El título, la sección y las etiquetas no cambian. Tarda unos 30 segundos.',
      boton: 'Sí, rehacer',
      peligro: false,
      conNota: false,
      recargar: 'articulos',
      accion: function () { return llamar('volverAConvertirArticulo', filaR, postR); }
    });
  }

  // --- Imagen principal ---
  if (accion === 'portada-elegir') {
    boton.parentNode.querySelector('[data-portada-archivo]').click();
    return;
  }
  if (accion === 'portada-ajustar') {
    var filaP = tarjeta.getAttribute('data-fila');
    var art = estado.datos.articulos.filter(function (x) { return String(x.fila) === filaP; })[0];
    abrirPortada(filaP, 'https://drive.google.com/thumbnail?id=' + art.portada + '&sz=w1600', '', art.encuadrePc, art.encuadreCelular, art.postId, art.encuadreTarjeta);
    return;
  }
  if (accion === 'editar-nota') {
    boton.disabled = true;
    abrirEdicion(tarjeta.getAttribute('data-fila'), tarjeta.getAttribute('data-post'))
      .catch(function (err) { boton.disabled = false; avisar(mensajeError(err), true); });
    return;
  }
  if (accion === 'clonar-nota') {
    var filaC = Number(tarjeta.getAttribute('data-fila')), postC = tarjeta.getAttribute('data-post'), clon = null;
    pedirConfirmacion(tarjeta, {
      pregunta: '¿Clonar «' + ((tarjeta.querySelector('h3') || {}).textContent || 'esta nota') + '»? Se crea una copia como borrador (Por revisar) y se abre para editarla; la original no cambia. ' +
        'La copia es nota del CIAD: al publicarla no se le escribe al autor.',
      boton: 'Sí, clonar',
      recargar: 'articulos',
      accion: function () { return llamar('clonarNota', filaC, postC).then(function (r) { clon = r; return r; }); },
      despues: function () {
        if (!clon) return;
        estado.filtro.articulos = 'revision';
        pintar();
        abrirEdicion(String(clon.fila), clon.postId).then(function () {
          var t = document.querySelector('.tarjeta[data-fila="' + clon.fila + '"]');
          if (t) t.scrollIntoView({ block: 'start', behavior: 'smooth' });
        }, function (err) { avisar(mensajeError(err), true); });
      }
    });
    return;
  }
  if (accion === 'cancelar-edicion') {
    delete estado.ediciones[tarjeta.getAttribute('data-fila')];
    delete estado.portadas[tarjeta.getAttribute('data-fila')];
    pintar();
    return;
  }
  if (accion === 'guardar-nota') {
    var filaN = tarjeta.getAttribute('data-fila'), edN = estado.ediciones[filaN], postN = tarjeta.getAttribute('data-post');
    var selN = tarjeta.querySelector('[data-seccion]');
    var pendienteN = tarjeta.querySelector('[data-chip-input]');
    if (pendienteN && pendienteN.value.trim()) agregarEtiqueta(pendienteN);
    if (!edN.titulo.trim()) { tarjeta.querySelector('[data-editar="titulo"]').focus(); avisar('El título no puede quedar vacío.', true); return; }
    if (!selN.value) { selN.closest('.campo-seccion').classList.add('con-error'); selN.focus(); avisar('Elige la sección del blog.', true); return; }
    var editorN = tarjeta.querySelector('[data-editar-cuerpo]');
    if (editorN) instantanea(editorN);
    var envio = { titulo: edN.titulo, subtitulo: edN.subtitulo, ficha: edN.ficha, cuerpo: edN.cuerpoNuevo, seccion: selN.value,
      etiquetas: tarjeta.querySelector('[data-etiquetas]').value };
    var portadaN = estado.portadas[filaN];
    pedirConfirmacion(tarjeta, {
      pregunta: '¿Guardar los cambios? Se verán en el blog de inmediato.',
      boton: 'Sí, guardar',
      recargar: 'articulos',
      accion: function () {
        // Primero la imagen principal (si se abrió su ajuste) y después lo demás: cada paso lee la entrada ya actualizada
        var paso = portadaN ? guardarPortada(filaN, postN) : Promise.resolve();
        return paso.then(function () { return llamar('guardarNotaEditada', Number(filaN), postN, envio); })
          .then(function (r) { delete estado.ediciones[filaN]; delete estado.portadas[filaN]; delete estado.cabeceras[postN]; return r; });
      }
    });
    return;
  }
  if (accion === 'portada-centrar') {
    moverPortada(tarjeta, boton.getAttribute('data-vista'), { x: 50, y: 50, z: 100 });
    return;
  }
  if (accion === 'portada-cancelar') {
    delete estado.portadas[tarjeta.getAttribute('data-fila')];
    pintar();
    return;
  }
  if (accion === 'portada-guardar') {
    var filaG = tarjeta.getAttribute('data-fila');
    ejecutar(boton.parentNode, guardarPortada(filaG, tarjeta.getAttribute('data-post'))
      .then(function (r) { delete estado.portadas[filaG]; return r; }), 'articulos');
    return;
  }

  if (accion === 'reintentar-articulo') {
    ejecutar(tarjeta.querySelector('.acciones'), llamar('reintentarArticulo', Number(tarjeta.getAttribute('data-fila'))), 'articulos');
  }

  // --- Comentarios ---
  if (accion === 'aprobar-comentario') {
    ejecutar(tarjeta.querySelector('.acciones'), llamar('aprobarComentario', tarjeta.getAttribute('data-id')), 'comentarios');
  }

  if (accion === 'rechazar-comentario') {
    var id = tarjeta.getAttribute('data-id');
    pedirConfirmacion(tarjeta, {
      pregunta: '¿Rechazar este comentario?',
      boton: 'Sí, rechazar',
      peligro: true,
      conNota: true,
      placeholder: 'Nota para el lector (opcional). Si la escribes, se le envía por correo.',
      recargar: 'comentarios',
      accion: function (nota) { return llamar('rechazarComentario', id, nota); }
    });
  }

  if (accion === 'bloquear-usuario') {
    var uid = tarjeta.getAttribute('data-uid');
    var nombre = tarjeta.getAttribute('data-nombre');
    pedirConfirmacion(tarjeta, {
      pregunta: '¿Bloquear a ' + (nombre || 'esta cuenta') + '? Ya no podrá comentar y se rechazarán todos sus pendientes.',
      boton: 'Sí, bloquear',
      peligro: true,
      conNota: true,
      notaObligatoria: true,
      placeholder: 'Motivo del bloqueo (solo lo ve el CIAD).',
      recargar: 'comentarios',
      accion: function (motivo) { return llamar('bloquearUsuario', uid, nombre, motivo); }
    });
  }

  if (accion === 'desbloquear') {
    var filaB = boton.closest('.fila-bloqueado');
    ejecutar(filaB, llamar('desbloquearUsuario', filaB.getAttribute('data-uid')), 'comentarios');
  }
});


// Recordar la sección o solicitud elegida aunque el panel se recargue
document.addEventListener('change', function (e) {
  var sel = e.target;
  if (sel.hasAttribute('data-seccion')) estado.elecciones['seccion-' + sel.getAttribute('data-fila')] = sel.value;
  if (sel.hasAttribute('data-folio')) estado.elecciones['folio-' + sel.getAttribute('data-fila')] = sel.value;
  if (sel.hasAttribute('data-orden')) { estado.orden[estado.pestana] = sel.value; pintar(); }
  // NOTA: Chrome lanza "change" a mitad de escribir el año (0002, 0020…); se ignora hasta que esté completo
  if (sel.hasAttribute('data-periodo') && !(sel.value && sel.value < '1900')) { estado.periodo[estado.pestana][sel.getAttribute('data-periodo')] = sel.value; pintar(); }
});
// Las etiquetas (chips) se guardan en estado.elecciones y se conservan con la recarga automática
</script>
<script>
// ===== Páginas: editor de las páginas del blog (ver Paginas.gs) =====
var PG = {};
var ESTADO_PAGINAS = {};   // { tipo: { habilitada, motivo } }; se pide una vez al abrir Páginas
var estadoPaginasPedido = false;   // Por página: { datos, original, url, version, error, cargando, abiertas:{}, reemplazando:null }

function pgEstado() { return PG[estado.filtro.paginas]; }
function pgSucio(st) { return !!(st && st.datos && JSON.stringify(st.datos) !== st.original); }

function pgObtener(obj, ruta) {
  return ruta.split('.').reduce(function (o, k) { return o == null ? o : o[k]; }, obj);
}
function pgAsignar(obj, ruta, valor) {
  var partes = ruta.split('.'), ult = partes.pop();
  pgObtener(obj, partes.join('.'))[ult] = valor;
}

function pgCargar(tipo, silencioso) {
  PG[tipo] = PG[tipo] || {};
  PG[tipo].cargando = true; PG[tipo].error = null;
  if (!silencioso) pintar();
  return llamar('obtenerPaginaPanel', tipo).then(function (r) {
    PG[tipo] = { datos: r.datos, original: JSON.stringify(r.datos), url: r.url, version: r.version, abiertas: {}, reemplazando: null };
  }).catch(function (err) {
    PG[tipo] = { error: mensajeError(err) };
  }).then(function () { if (estado.pestana === 'paginas') pintar(); });
}

function pgPedirEstado() {
  if (estadoPaginasPedido) return;
  estadoPaginasPedido = true;
  llamar('obtenerEstadoPaginas').then(function (r) {
    ESTADO_PAGINAS = r || {};
    if (estado.pestana === 'paginas') pintar();
  }).catch(function () { estadoPaginasPedido = false; });
}

/** Precarga en segundo plano (sin volver a pintar la pestaña abierta). Si algo falla, la pestaña lo pide al abrirse. */
function precargarPestanas() {
  pgPedirEstado();
  if (!PG[estado.filtro.paginas]) pgCargar(estado.filtro.paginas, true);
  if (!MT.datos && !MT.cargando) mtCargar();
  metCargar();
  guiaCargar();
}

function pgMiniatura(id) { return id ? 'https://img.youtube.com/vi/' + id + '/mqdefault.jpg' : ''; }

function pgCampo(etiqueta, ruta, valor, opciones) {
  opciones = opciones || {};
  var control = opciones.area
    ? '<textarea data-ruta="' + ruta + '" rows="' + (opciones.filas || 3) + '" placeholder="' + esc(opciones.placeholder || '') + '">' + esc(valor || '') + '</textarea>'
    : '<input type="text" data-ruta="' + ruta + '" value="' + esc(valor || '') + '" placeholder="' + esc(opciones.placeholder || '') + '"' + (opciones.auto ? ' data-autotitulo="' + opciones.auto + '"' : '') + '>';
  return '<label class="pg-campo' + (opciones.clase ? ' ' + opciones.clase : '') + '"><span>' + esc(etiqueta) + '</span>' + control + '</label>';
}

function pgBotonesOrden(rutaLista, i, total) {
  return '<button class="pg-mini" data-pg="mover" data-lista="' + rutaLista + '" data-i="' + i + '" data-dir="-1" type="button" title="Subir"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
    '<button class="pg-mini" data-pg="mover" data-lista="' + rutaLista + '" data-i="' + i + '" data-dir="1" type="button" title="Bajar"' + (i === total - 1 ? ' disabled' : '') + '>↓</button>' +
    '<button class="pg-mini peligro" data-pg="eliminar" data-lista="' + rutaLista + '" data-i="' + i + '" type="button" title="Eliminar">Eliminar</button>';
}

// --- Pintar ---
function pintarPaginas() {
  var tipo = estado.filtro.paginas;
  var st = PG[tipo];
  var lista = document.getElementById('lista');

  pgPedirEstado();

  function mostrar(html) { lista.innerHTML = '<div class="pg-layout">' + pgMenu() + '<div class="pg-editor">' + html + '</div></div>'; }

  if (!st || (!st.datos && !st.error && !st.cargando)) { pgCargar(tipo); mostrar('<div class="mensaje-lista">Cargando…</div>'); return; }
  if (st.cargando) { mostrar('<div class="mensaje-lista">Cargando…</div>'); return; }
  if (st.error) {
    var sinFormato = ESTADO_PAGINAS[tipo] && !ESTADO_PAGINAS[tipo].habilitada;
    mostrar('<div class="mensaje-lista error">' + (sinFormato ? 'Esta página todavía no se puede editar desde el panel. ' : 'No se pudo cargar: ') + esc(st.error) +
      '<br><br><button class="boton secundario" data-pg="recargar" type="button">Reintentar</button></div>');
    return;
  }

  var scroll = window.scrollY;
  mostrar(pgBarra(st) + (tipo === 'multimedia' ? pgEditorMultimedia(st) : tipo === 'guias' ? pgEditorGuias(st) : pgEditorTextos(st)));
  window.scrollTo(0, scroll);
}

/** Menú lateral: cada página con un punto de estado (verde lista, amarillo sin publicar, rojo no editable). */
function pgMenu() {
  return '<nav class="pg-menu" aria-label="Páginas">' + FILTROS.paginas.map(function (f) {
    var e = ESTADO_PAGINAS[f.clave], sucio = pgSucio(PG[f.clave]);
    var punto = sucio ? 'sucio' : e && !e.habilitada ? 'error' : e ? 'ok' : '';
    var nota = sucio ? 'Cambios sin publicar' : e && !e.habilitada ? 'No editable' : '';
    return '<button class="pg-item' + (f.clave === estado.filtro.paginas ? ' activo' : '') + '" data-pg="ir" data-tipo="' + f.clave + '" type="button"' +
      (e && e.motivo ? ' title="' + esc(e.motivo) + '"' : '') + '>' +
      '<span class="pg-punto ' + punto + '"></span><span>' + esc(f.texto) + (nota ? '<small>' + nota + '</small>' : '') + '</span></button>';
  }).join('') + '</nav>';
}

function pgBarra(st) {
  var sucio = pgSucio(st);
  return '<div class="pg-barra">' +
    '<div><b>' + esc(pgNombre(estado.filtro.paginas)) + '</b>' +
      (st.url ? ' · <a href="' + esc(estado.filtro.paginas === 'inicio' ? st.url.replace(/\/p\/inicio\.html.*$/, '/') : st.url) + '" target="_blank" rel="noopener">Ver en el blog ↗</a>' : '') +
      '<span class="pg-estado' + (sucio ? ' sucio' : '') + '" id="pg-estado">' + (sucio ? 'Cambios sin publicar' : 'Sin cambios') + '</span></div>' +
    '<div class="pg-barra-botones">' +
      '<button class="boton secundario" data-pg="descartar" type="button" id="pg-descartar"' + (sucio ? '' : ' disabled') + '>Descartar cambios</button>' +
      '<button class="boton principal" data-pg="publicar" type="button" id="pg-publicar"' + (sucio ? '' : ' disabled') + '>Publicar cambios</button>' +
    '</div></div>';
}

function pgActualizarBarra() {
  var st = pgEstado(), sucio = pgSucio(st);
  var el = document.getElementById('pg-estado');
  if (!el) return;
  el.textContent = sucio ? 'Cambios sin publicar' : 'Sin cambios';
  el.className = 'pg-estado' + (sucio ? ' sucio' : '');
  document.getElementById('pg-publicar').disabled = !sucio;
  document.getElementById('pg-descartar').disabled = !sucio;
  var menu = document.querySelector('.pg-menu');
  if (menu) menu.outerHTML = pgMenu();
}

function pgNombre(tipo) {
  var f = FILTROS.paginas.filter(function (x) { return x.clave === tipo; })[0];
  return f ? f.texto : tipo;
}

// --- Páginas de solo textos ---
function pgEditorTextos(st) {
  var d = st.datos, grupos = [], porTitulo = {};
  // "Equipo · título" → sección "Equipo", campo "Título"
  d.textos.forEach(function (t, i) {
    var partes = t.clave.split(/\s*(?:·|&#183;)\s*/);
    var seccion = partes.length > 1 ? partes[0] : 'Textos generales';
    var nombre = partes.length > 1 ? partes.slice(1).join(' · ') : t.clave;
    if (!porTitulo[seccion]) grupos.push(porTitulo[seccion] = { titulo: seccion, campos: '' });
    porTitulo[seccion].campos += pgCampo(nombre.charAt(0).toUpperCase() + nombre.slice(1), 'textos.' + i + '.texto', t.texto, t.largo ? { area: true, filas: Math.min(8, Math.max(2, Math.ceil(t.texto.length / 95))) } : {});
  });

  var h = estado.filtro.paginas === 'inicio' ? '<p class="pg-ayuda">Estos textos se muestran en la portada del blog.</p>' : '';
  var equipoPuesto = false;
  grupos.forEach(function (g) {
    var conEquipo = d.equipo && g.titulo === 'Equipo';
    equipoPuesto = equipoPuesto || conEquipo;
    h += '<section class="tarjeta pg-bloque"><h3>' + esc(g.titulo) + '</h3>' + g.campos + (conEquipo ? pgEditorEquipo(d.equipo) : '') + '</section>';
  });
  if (d.equipo && !equipoPuesto) h += '<section class="tarjeta pg-bloque"><h3>Equipo</h3>' + pgEditorEquipo(d.equipo) + '</section>';
  return h + '<p class="pg-ayuda">Solo cambia el contenido; el diseño de la página se conserva. En los párrafos, cada salto de línea se publica como un salto de línea.</p>';
}

function pgIniciales(nombre) {
  return String(nombre || '').split(/\s+/).filter(function (p) { return p && p.indexOf('.') === -1; })
    .slice(0, 2).map(function (p) { return p.charAt(0).toUpperCase(); }).join('');
}

function pgEditorEquipo(equipo) {
  var h = '<div class="pg-equipo">';
  equipo.forEach(function (m, i) {
    var r = 'equipo.' + i;
    h += '<div class="pg-integrante">' +
      '<div class="pg-foto">' + (m.foto ? '<img src="' + esc(m.foto) + '" alt="">' : '<span>' + esc(pgIniciales(m.nombre)) + '</span>') + '</div>' +
      '<div><div class="pg-rejilla">' + pgCampo('Nombre', r + '.nombre', m.nombre) + pgCampo('Cargo', r + '.cargo', m.cargo) + '</div>' +
        pgCampo('Foto (enlace, opcional)', r + '.foto', m.foto, { placeholder: 'https://…' }) + '</div>' +
      '<div class="pg-acciones">' + pgBotonesOrden('equipo', i, equipo.length) + '</div></div>';
  });
  return h + '</div><button class="pg-mini" data-pg="agregar-integrante" type="button">+ Agregar integrante</button>' +
    '<p class="pg-ayuda" style="margin-top:8px">Los integrantes sin nombre no se publican.</p>';
}

// --- Multimedia ---
function pgEditorMultimedia(st) {
  var d = st.datos;
  var h = '<div class="tarjeta pg-bloque"><h3>Encabezado de la página</h3>' +
    pgCampo('Título', 'titulo', d.titulo) +
    pgCampo('Descripción', 'descripcion', d.descripcion, { area: true, filas: 2 }) + '</div>';

  h += '<div class="tarjeta pg-bloque"><h3>Agregar video</h3>' +
    '<div class="pg-agregar"><input type="text" id="pg-nuevo-video" placeholder="Pega el enlace de YouTube (watch, youtu.be o shorts)">' +
    '<button class="boton principal" data-pg="agregar-video" type="button">Agregar</button></div>' +
    '<p class="pg-ayuda">El título se llena solo con el del video; después puedes cambiarlo.</p></div>';

  h += '<h3 class="pg-subtitulo">Videos publicados (' + d.videos.length + ')</h3>';
  if (!d.videos.length) h += '<div class="mensaje-lista">Aún no hay videos.</div>';

  d.videos.forEach(function (v, i) {
    var r = 'videos.' + i;
    h += '<div class="tarjeta pg-video">' +
      '<a class="pg-miniatura" href="https://www.youtube.com/watch?v=' + esc(v.id) + '" target="_blank" rel="noopener"><img src="' + pgMiniatura(v.id) + '" alt=""><span>▶</span></a>' +
      '<div class="pg-video-campos">' +
        pgCampo('Título', r + '.titulo', v.titulo) +
        pgCampo('Descripción', r + '.descripcion', v.descripcion, { area: true, filas: 2 }) +
        pgCampo('Etiqueta', r + '.etiqueta', v.etiqueta, { clase: 'corto' }) +
        (st.reemplazando === i
          ? '<div class="pg-agregar"><input type="text" id="pg-reemplazo" placeholder="Enlace del video nuevo">' +
            '<label class="pg-check"><input type="checkbox" id="pg-reemplazo-titulo"> Usar el título del video nuevo</label>' +
            '<button class="boton principal" data-pg="confirmar-reemplazo" data-i="' + i + '" type="button">Reemplazar</button>' +

          : '') +

        '<button class="pg-mini" data-pg="reemplazar" data-i="' + i + '" type="button">Reemplazar video</button></div>' +
    '</div>';
  });
  return h;
}

function pgEditorGuias(st) {

document.addEventListener('input', function (e) {

document.addEventListener('toggle', function (e) {

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-pg]');
  if (!b || estado.pestana !== 'paginas') return;
  var tipo = estado.filtro.paginas, st = pgEstado(), accion = b.getAttribute('data-pg');
  var listaRuta = b.getAttribute('data-lista'), i = Number(b.getAttribute('data-i'));

  function ocupado(promesa) {
    b.disabled = true;
    return promesa.catch(function (err) { avisar(mensajeError(err), true); }).then(function () { b.disabled = false; });
  }

  if (accion === 'ir') { estado.filtro.paginas = b.getAttribute('data-tipo'); pintar(); return; }
  if (accion === 'recargar') { pgCargar(tipo); return; }
  if (accion === 'agregar-integrante') { st.datos.equipo.push({ nombre: '', cargo: '', foto: '' }); pintar(); return; }

  if (accion === 'mover') {
    var arr = pgObtener(st.datos, listaRuta), j = i + Number(b.getAttribute('data-dir'));
    if (j < 0 || j >= arr.length) return;
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    if (listaRuta === 'guias') { var ab = st.abiertas[i]; st.abiertas[i] = st.abiertas[j]; st.abiertas[j] = ab; }
    pintar(); return;
  }

  if (accion === 'eliminar') {
    if (!b.classList.contains('confirmando')) {
      b.classList.add('confirmando'); b.textContent = '¿Seguro? Clic otra vez';
      setTimeout(function () { if (document.body.contains(b)) { b.classList.remove('confirmando'); b.textContent = 'Eliminar'; } }, 3000);
      return;
    }
    pgObtener(st.datos, listaRuta).splice(i, 1);
    if (listaRuta === 'guias') st.abiertas = {};
    pintar(); return;
  }

  if (accion === 'agregar-video') {
    var url = document.getElementById('pg-nuevo-video').value;
    ocupado(llamar('infoVideoYoutube', url).then(function (v) {
      if (st.datos.videos.some(function (x) { return x.id === v.id; })) { avisar('Ese video ya está en la página.', true); return; }
      st.datos.videos.unshift({ id: v.id, titulo: v.titulo, descripcion: '', etiqueta: 'Video' });
      avisar('Video agregado al inicio de la lista. Recuerda publicar los cambios.');
      pintar();
    }));
    return;
  }

  if (accion === 'reemplazar') { st.reemplazando = i; pintar(); document.getElementById('pg-reemplazo').focus(); return; }
  if (accion === 'cancelar-reemplazo') { st.reemplazando = null; pintar(); return; }
  if (accion === 'confirmar-reemplazo') {
    var urlR = document.getElementById('pg-reemplazo').value;
    var usarTitulo = document.getElementById('pg-reemplazo-titulo').checked;
    ocupado(llamar('infoVideoYoutube', urlR).then(function (v) {
      var video = st.datos.videos[i];
      video.id = v.id;
      if (usarTitulo) video.titulo = v.titulo;
      st.reemplazando = null;
      pintar();
    }));
    return;
  }

  if (accion === 'agregar-guia') {
    st.datos.guias.push({ ancla: '', menu: 'Nueva guía', etiqueta: '', titulo: 'Nueva guía', subtitulo: '', descripcion: '', video: '', imagen: '', imagenAlt: '',
      recursos: [{ titulo: 'Video tutoriales', descripcion: '', enlaces: [] }, { titulo: 'Herramientas', descripcion: '', enlaces: [] }, { titulo: 'Más recursos de apoyo', descripcion: '', enlaces: [] }] });
    st.abiertas[st.datos.guias.length - 1] = true;
    pintar(); return;
  }

  if (accion === 'video-guia') {
    var g = Number(b.getAttribute('data-g'));
    ocupado(llamar('infoVideoYoutube', document.getElementById('pg-video-' + g).value).then(function (v) {
      var guia = st.datos.guias[g];
      guia.video = v.id;
      if (/picsum\.photos/.test(guia.imagen || '')) guia.imagen = ''; // La imagen de relleno se cambia por la miniatura del video
      st.abiertas[g] = true; pintar();
    }));
    return;
  }
  if (accion === 'quitar-video-guia') { st.datos.guias[Number(b.getAttribute('data-g'))].video = ''; pintar(); return; }

  if (accion === 'agregar-enlace') { pgObtener(st.datos, listaRuta).push({ texto: '', url: '' }); pintar(); return; }
  if (accion === 'agregar-grupo') { pgObtener(st.datos, listaRuta).push({ titulo: 'Nuevo desplegable', descripcion: '', enlaces: [] }); pintar(); return; }

  if (accion === 'descartar') { st.datos = JSON.parse(st.original); st.reemplazando = null; pintar(); return; }

  if (accion === 'publicar') {
    ocupado(llamar('publicarPaginaPanel', tipo, st.datos, st.version).then(function (r) {
      avisar(r.mensaje);
      return pgCargar(tipo);   // Recarga lo que quedó publicado
    }));
    // Si falla, ocupado() muestra el error y los cambios siguen en pantalla sin marcarse como publicados
  }
});

// Aviso al cerrar el panel con cambios sin publicar
window.addEventListener('beforeunload', function (e) {

  if (sucia) { e.preventDefault(); e.returnValue = ''; }
});

<script>
// ===== Guía de uso (se carga desde Guia.html solo al abrir la pestaña) =====
var GUIA = { html: '', error: '', cargando: false };

function guiaCargar() {
  if (GUIA.html || GUIA.cargando) return;
  GUIA.cargando = true; GUIA.error = '';
  llamar('obtenerGuia')
    .then(function (html) { GUIA.html = html; })
    .catch(function (err) { GUIA.error = mensajeError(err); })
    .then(function () { GUIA.cargando = false; if (estado.pestana === 'guia') pintar(); });
}

function pintarGuia() {
  var lista = document.getElementById('lista');
  if (GUIA.error) {
    lista.innerHTML = '<div class="mensaje-lista error">No se pudo cargar la guía: ' + esc(GUIA.error) +
      '<br><br><button class="boton secundario" data-guia="recargar" type="button">Reintentar</button></div>';
    return;
  }
  if (!GUIA.html) {
    lista.innerHTML = '<div class="mensaje-lista">Cargando guía…</div>';
    guiaCargar();
    return;
  }
  lista.innerHTML =
    '<div class="tarjeta guia-barra">' +
      '<p>Guía para el personal autorizado del CIAD. También puedes descargarla para consultarla sin abrir el panel.</p>' +
      '<button class="boton principal" data-guia="pdf" type="button">Descargar PDF</button>' +
    '</div>' +
    '<div class="tarjeta">' + GUIA.html + '</div>';
}

function descargarGuiaPdf(boton) {
  boton.disabled = true;
  boton.textContent = 'Generando PDF…';
  llamar('descargarGuiaPdf').then(function (r) {
    var binario = atob(r.base64), bytes = new Uint8Array(binario.length);
    for (var i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    var enlace = document.createElement('a');
    enlace.href = url;
    enlace.download = r.nombre;
    document.body.appendChild(enlace);
    enlace.click();
    enlace.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }).catch(function (err) {
    avisar('No se pudo generar el PDF: ' + mensajeError(err), true);
  }).then(function () {
    boton.disabled = false;
    boton.textContent = 'Descargar PDF';
  });
}

document.addEventListener('click', function (e) {
  if (estado.pestana !== 'guia') return;
  var b = e.target.closest('[data-guia]');
  if (b) {
    if (b.getAttribute('data-guia') === 'pdf') descargarGuiaPdf(b);
    if (b.getAttribute('data-guia') === 'recargar') { GUIA.error = ''; pintar(); }
    return;
  }
  // Índice de la guía: el panel usa <base target="_top">, así que los enlaces #ancla se resuelven aquí
  var ir = e.target.closest('[data-ir]');
  if (ir) {
    e.preventDefault();
    var destino = document.getElementById(ir.getAttribute('data-ir'));
    if (destino) destino.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
});

// ===== Mantenimiento (Mantenimiento.gs): revisar y limpiar el espacio sin abrir el editor =====
var MT = { datos: null, error: '', cargando: false, ocupado: '', elegidas: {}, confirmar: false };

function mtCargar() {
  MT.cargando = true; MT.error = '';
  llamar('obtenerMantenimiento')
    .then(function (d) { MT.datos = d; })
    .catch(function (err) { MT.error = mensajeError(err); })
    .then(function () { MT.cargando = false; if (estado.pestana === 'mantenimiento') pintar(); });
}

// Qué significa cada grupo, en palabras del personal (en el orden de la pantalla)
var MT_GRUPOS = {
  'Sin uso en el blog': 'Archivos dentro de las carpetas del blog que ninguna nota, página ni el diseño muestran (imágenes reemplazadas, pruebas, copias).',
  'Carpetas de artículos': 'Artículos rechazados, eliminados del blog o intentos fallidos, y respaldos (Doc/PDF) de notas ya publicadas.',
  'Subidas del formulario': 'Lo que llegó por el formulario de envío y ya no hace falta.',
  'Imágenes pesadas': 'Imágenes más grandes de lo que el blog muestra. Se guardan a 2000 px: no se borran, mantienen su enlace y la nota se ve igual.',
  'Blogger': 'Borradores que dejó el Publicador y ninguna solicitud usa.',
  'Comentarios': 'Comentarios rechazados hace tiempo.'
};

// Qué pasa con cada elemento, de menos a más grave (así se agrupa la confirmación)
var MT_ACCIONES = [
  { prueba: /^reducir/i, titulo: 'Se reducen', nota: 'se quedan en su lugar con el mismo enlace', clase: '' },
  { prueba: /^papelera/i, titulo: 'Van a la papelera', nota: 'se recuperan desde la papelera de Drive durante 30 días', clase: '' },
  { prueba: /sin deshacer/i, titulo: 'Se borran para siempre', nota: 'no se pueden recuperar', clase: ' sin-deshacer' }
];
function mtTipoAccion(f) {
  for (var i = 0; i < MT_ACCIONES.length; i++) if (MT_ACCIONES[i].prueba.test(f.accion)) return MT_ACCIONES[i];
  return { titulo: f.accion, nota: '', clase: '' };
}
/** Lo elegido agrupado por lo que le va a pasar: [{ a: acción, l: filas }] */
function mtPorAccion(elegidas) {
  var g = [];
  MT_ACCIONES.concat([null]).forEach(function (a) {
    var l = elegidas.filter(function (f) { var t = mtTipoAccion(f); return a ? t === a : MT_ACCIONES.indexOf(t) === -1; });
    if (l.length) g.push({ a: a || mtTipoAccion(l[0]), l: l });
  });
  return g;
}

/** "12.3 MB" → bytes (el informe guarda el tamaño ya formateado). */
function mtBytes(t) {
  var m = String(t || '').match(/([\d.]+)\s*(B|KB|MB|GB)/);
  return m ? Number(m[1]) * { B: 1, KB: 1024, MB: 1048576, GB: 1073741824 }[m[2]] : 0;
}
function mtTamano(b) {
  if (b < 1048576) return Math.round(b / 1024) + ' KB';
  if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
  return (b / 1073741824).toFixed(2) + ' GB';
}

function pintarMantenimiento() {
  var lista = document.getElementById('lista');
  if (MT.error) { lista.innerHTML = '<div class="mensaje-lista error">' + esc(MT.error) + '</div>'; return; }
  if (!MT.datos) { lista.innerHTML = '<div class="mensaje-lista">Cargando…</div>'; if (!MT.cargando) mtCargar(); return; }

  var filas = MT.datos.filas || [];
  var accionables = filas.filter(function (f) { return f.tipo !== 'info' && !f.resultado; });
  var hechas = filas.filter(function (f) { return f.tipo !== 'info' && f.resultado; });
  var info = filas.filter(function (f) { return f.tipo === 'info'; });
  var elegidas = accionables.filter(function (f) { return MT.elegidas[f.fila]; });
  var ocupado = !!MT.ocupado;
  var dis = ocupado ? ' disabled' : '';

  var suma = function (l) { return l.reduce(function (t, f) { return t + mtBytes(f.tamano); }, 0); };
  var usoFila = info.filter(function (f) { return f.categoria === 'Resumen' && f.elemento === 'Espacio del blog'; })[0];
  var uso = usoFila ? mtBytes(usoFila.tamano) : 0;
  var liberar = suma(accionables);

  // 1. Cabecera: qué es, cuándo se revisó y las cifras principales
  var html = '<div class="tarjeta">' +
    '<div class="mt-cabecera"><div><h2>Espacio del blog</h2><p>' +
      (MT.datos.fecha ? 'Última revisión: ' + esc(MT.datos.fecha) : 'Todavía no se ha revisado') +
      ' · Solo se revisa "Blog CIAD · sistema"; nada personal.</p></div>' +
      '<div class="mt-botones">' +
        '<button class="boton secundario" data-mt="ordenar" type="button"' + dis + ' title="Pasa cada artículo publicado a Publicados <año> con todas sus imágenes">' + (MT.ocupado === 'ordenar' ? 'Ordenando…' : 'Ordenar publicados') + '</button>' +
        '<button class="boton principal" data-mt="auditar" type="button"' + dis + '>' + (MT.ocupado === 'auditar' ? 'Revisando… (≈30 s)' : 'Revisar ahora') + '</button>' +
      '</div></div>';
  if (filas.length) {
    html += '<div class="mt-cifras">' +
      '<div class="mt-cifra"><b>' + (uso ? mtTamano(uso) : '—') + '</b><span>Usa el blog en Drive</span></div>' +
      '<div class="mt-cifra liberar"><b>' + mtTamano(liberar) + '</b><span>Se puede liberar (aprox.)</span></div>' +
      '<div class="mt-cifra"><b>' + accionables.length + '</b><span>Elementos por decidir</span></div>' +
      '<div class="mt-cifra"><b>' + hechas.length + '</b><span>Ya aplicados</span></div>' +
    '</div>';
    if (uso) html += '<div class="mt-barra-uso" title="Parte del espacio del blog que se puede liberar"><i style="width:' + Math.min(100, Math.round(liberar / uso * 100)) + '%"></i></div>';
  }
  html += '<details class="mt-reglas"><summary>¿Cómo decide qué sobra?</summary><ul>' +
    '<li>Lee todas las notas (publicadas, borradores y programadas), las páginas y el diseño del blog, y anota qué archivos de Drive muestran.</li>' +
    '<li>Todo archivo dentro de "Blog CIAD · sistema" que nada de eso muestra se propone para la papelera.</li>' +
    '<li>Nunca propone: artículos que siguen en proceso, respaldos de páginas, formularios, hojas ni la plantilla "Demo Articulo".</li>' +
    '<li>Imágenes pesadas: las de más de 500 KB se pueden guardar a 2000 px (lo máximo que muestra el blog). Mismo enlace; Drive libera el espacio en 30 días.</li>' +
    '<li>Revisar no borra nada. Lo que mandes a la papelera de Drive se recupera durante 30 días; borradores y comentarios no.</li>' +
  '</ul></details></div>';

  if (!filas.length) {
    lista.innerHTML = html + '<div class="mensaje-lista">Pulsa "Revisar ahora" para ver qué se puede limpiar.</div>';
    return;
  }

  // 2. Un bloque por grupo, de lo más pesado a lo más ligero
  if (accionables.length) {
    var grupos = {};
    accionables.forEach(function (f) { (grupos[f.categoria] = grupos[f.categoria] || []).push(f); });
    var orden = Object.keys(MT_GRUPOS).filter(function (g) { return grupos[g]; })
      .concat(Object.keys(grupos).filter(function (g) { return !MT_GRUPOS[g]; }));
    orden.forEach(function (g) {
      var l = grupos[g].slice().sort(function (a, b) { return mtBytes(b.tamano) - mtBytes(a.tamano); });
      var todos = l.every(function (f) { return MT.elegidas[f.fila]; });
      html += '<div class="tarjeta"><div class="mt-grupo-cab"><h3>' + esc(g) + ' · ' + l.length + '</h3>' +
        '<span class="mt-sub">' + (suma(l) ? mtTamano(suma(l)) + ' · ' : '') +
        '<button class="mt-enlace" data-mt="grupo" data-grupo="' + esc(g) + '" type="button"' + dis + '>' + (todos ? 'Quitar grupo' : 'Elegir grupo') + '</button></span></div>' +
        (MT_GRUPOS[g] ? '<p class="mt-grupo-desc">' + esc(MT_GRUPOS[g]) + '</p>' : '');
      l.forEach(function (f) {
        var partes = String(f.elemento).split(' › ');
        var nombre = partes.pop();
        var sinDeshacer = /sin deshacer/i.test(f.accion);
        html += '<label class="mt-fila"><input type="checkbox" data-mt-fila="' + f.fila + '"' + (MT.elegidas[f.fila] ? ' checked' : '') + dis + '>' +
          '<span><b>' + esc(nombre) + '</b><small>' + esc(f.motivo) + (partes.length ? ' · en ' + esc(partes.join(' › ')) : '') +
          (f.enlace ? ' · <a href="' + esc(f.enlace) + '" target="_blank" rel="noopener">Abrir ↗</a>' : '') + '</small></span>' +
          '<span class="mt-lado">' + (f.tamano ? '<span class="mt-tam">' + esc(f.tamano) + '</span>' : '') +
          '<span class="mt-etiqueta' + (sinDeshacer ? ' sin-deshacer' : '') + '">' + esc(mtTipoAccion(f).titulo) + '</span></span></label>';
      });
      html += '</div>';
    });

    // 3. Barra fija: qué pasará con lo elegido (agrupado por acción), cuánto se libera y confirmación
    var porAccion = mtPorAccion(elegidas);
    var desglose = porAccion.map(function (g) { return '<span class="mt-etiqueta' + g.a.clase + '">' + esc(g.a.titulo) + ': ' + g.l.length + '</span>'; }).join(' ');
    html += '<div class="tarjeta mt-acciones">' +
      (MT.confirmar
        ? '<div class="mt-revision" role="region" aria-label="Lo que se va a aplicar">' +
            '<p><b>Revisa antes de aplicar:</b> ' + elegidas.length + ' elemento(s) · se liberan ≈ ' + mtTamano(suma(elegidas)) + '</p>' +
            porAccion.map(function (g) {
              return '<h4 class="' + g.a.clase.trim() + '">' + esc(g.a.titulo) + ' (' + g.l.length + ')' + (g.a.nota ? ' <small>· ' + esc(g.a.nota) + '</small>' : '') + '</h4><ul>' +
                g.l.map(function (f) {
                  return '<li><span>' + esc(String(f.elemento).split(' › ').pop()) + ' <small>· ' + esc(f.categoria) + '</small></span>' +
                    (f.tamano ? '<b>' + esc(f.tamano) + '</b>' : '') + '</li>';
                }).join('') + '</ul>';
            }).join('') +
          '</div>' +
          '<span class="mt-total">' + desglose + '</span>' +
          '<button class="boton secundario" data-mt="cancelar" type="button"' + dis + '>Volver</button>' +
          '<button class="boton peligro-lleno" data-mt="aplicar" type="button"' + dis + '>' + (MT.ocupado === 'aplicar' ? 'Aplicando… no cierres el panel' : 'Sí, aplicar ' + elegidas.length) + '</button>'
        : '<span class="mt-total">' + (elegidas.length ? '<b>' + elegidas.length + ' elegido(s) · ≈ ' + mtTamano(suma(elegidas)) + '</b> ' + desglose : 'Elige lo que quieras limpiar. Nada se aplica hasta que lo confirmes.') + '</span>' +
          '<button class="boton secundario" data-mt="todo" type="button"' + dis + '>' + (elegidas.length === accionables.length ? 'Quitar selección' : 'Elegir todo') + '</button>' +
          '<button class="boton principal" data-mt="pedir" type="button"' + (elegidas.length && !ocupado ? '' : ' disabled') + '>Revisar y aplicar</button>') +
      '</div>';
  } else {
    html += '<div class="mensaje-lista">El blog no tiene nada que sobre. ✔</div>';
  }

  // 4. Historial y detalle, plegados para no estorbar
  if (hechas.length) {
    html += '<details class="tarjeta mt-plegable"><summary>Ya aplicado (' + hechas.length + ')</summary>' + hechas.map(function (f) {
      return '<div class="mt-fila"><span></span><span>' + esc(String(f.elemento).split(' › ').pop()) + '<small>' + esc(f.categoria) + (f.tamano ? ' · ' + esc(f.tamano) : '') + '</small></span>' +
        '<span class="mt-etiqueta' + (/^Error/.test(f.resultado) ? ' sin-deshacer' : ' hecho') + '">' + esc(f.resultado) + '</span></div>';
    }).join('') + '</details>';
  }
  html += '<details class="tarjeta mt-plegable"><summary>Detalle de la revisión</summary><table class="mt-resumen">' + info.map(function (f) {
    return '<tr><td><b>' + esc(f.categoria) + '</b></td><td>' + esc(f.elemento) + '</td><td>' + esc(f.motivo) + '</td><td>' + esc(f.tamano) + '</td></tr>';
  }).join('') + '</table></details>';

  lista.innerHTML = html;
}

function mtEjecutar(tipo, promesa) {
  MT.ocupado = tipo; accionesEnCurso++; pintar();
  return promesa.then(function (r) {
    if (r && r.datos) MT.datos = r.datos;
    avisar((r && r.mensaje) || (typeof r === 'string' ? r : 'Listo.'));
    if (tipo !== 'ordenar') { MT.elegidas = {}; MT.confirmar = false; }
  }).catch(function (err) {
    avisar(mensajeError(err), true);
  }).then(function () {
    MT.ocupado = ''; accionesEnCurso--; pintar();
  });
}

document.addEventListener('change', function (e) {
  if (estado.pestana !== 'mantenimiento') return;
  var c = e.target.closest('[data-mt-fila]');
  if (!c) return;
  MT.elegidas[c.getAttribute('data-mt-fila')] = c.checked;
  MT.confirmar = false;
  pintar();
});

document.addEventListener('click', function (e) {
  if (estado.pestana !== 'mantenimiento') return;
  var b = e.target.closest('[data-mt]');
  if (!b || b.disabled) return;
  var a = b.getAttribute('data-mt');
  if (a === 'auditar') mtEjecutar('auditar', llamar('auditarDesdePanel'));
  if (a === 'ordenar') mtEjecutar('ordenar', llamar('ordenarDesdePanel'));
  if (a === 'todo') {
    var pend = (MT.datos.filas || []).filter(function (f) { return f.tipo !== 'info' && !f.resultado; });
    var todas = pend.every(function (f) { return MT.elegidas[f.fila]; });
    MT.elegidas = {};
    if (!todas) pend.forEach(function (f) { MT.elegidas[f.fila] = true; });
    pintar();
  }
  if (a === 'grupo') {
    var g = (MT.datos.filas || []).filter(function (f) { return f.tipo !== 'info' && !f.resultado && f.categoria === b.getAttribute('data-grupo'); });
    var marcar = !g.every(function (f) { return MT.elegidas[f.fila]; });
    g.forEach(function (f) { MT.elegidas[f.fila] = marcar; });
    MT.confirmar = false; pintar();
  }
  if (a === 'pedir') { MT.confirmar = true; pintar(); }
  if (a === 'cancelar') { MT.confirmar = false; pintar(); }
  if (a === 'aplicar') {
    var filas = Object.keys(MT.elegidas).filter(function (k) { return MT.elegidas[k]; }).map(Number);
    mtEjecutar('aplicar', llamar('aplicarDesdePanel', filas));
  }
});
</script>
<script>
// ===== Métricas: de dónde vienen los artículos (hojas de solicitudes y artículos) =====
var MET = { datos: null, error: '', cargando: false, hora: '' };

function metCargar() {
  if (MET.cargando) return;
  MET.cargando = true; MET.error = '';
  llamar('obtenerMetricas')
    .then(function (d) { MET.datos = d; MET.hora = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }); })
    .catch(function (err) { MET.error = mensajeError(err); })
    .then(function () { MET.cargando = false; if (estado.pestana === 'metricas') pintar(); });
}

/** Cuenta por campo sin distinguir mayúsculas ni espacios; de mayor a menor. */
function metContar(lista, campo) {
  var mapa = {};
  lista.forEach(function (x) {
    var texto = String(x[campo] || '').replace(/\s+/g, ' ').trim();
    if (!texto) return;
    var k = texto.toLowerCase();
    (mapa[k] = mapa[k] || { texto: texto, n: 0 }).n++;
  });
  return Object.keys(mapa).map(function (k) { return mapa[k]; })
    .sort(function (a, b) { return b.n - a.n || a.texto.localeCompare(b.texto, 'es'); });
}

function metPct(n, total) { return total ? Math.round(n * 100 / total) + '%' : '0%'; }

function metBarras(titulo, nota, filas) {
  var total = filas.reduce(function (t, f) { return t + f.n; }, 0);
  var max = filas.length ? filas[0].n : 0;
  var li = function (f) {
    return '<li title="' + esc(f.texto + ': ' + f.n + ' (' + metPct(f.n, total) + ')') + '">' +
      '<span class="met-etiqueta">' + esc(f.texto) + '</span>' +
      '<span class="met-barra"><i style="width:' + (f.n * 100 / max) + '%' + (f.color ? ';background:' + f.color : '') + '"></i></span>' +
      '<b>' + f.n + ' <small>' + metPct(f.n, total) + '</small></b></li>';
  };
  var VISIBLES = 8;
  return '<div class="tarjeta met-grafica"><h3>' + esc(titulo) + '</h3><p>' + esc(nota) + '</p>' +
    (!filas.length ? '<p>Sin datos en este periodo.</p>' :
      '<ul class="met-lista">' + filas.slice(0, VISIBLES).map(li).join('') + '</ul>' +
      (filas.length > VISIBLES ? '<details><summary>Ver los ' + filas.length + '</summary><ul class="met-lista">' + filas.slice(VISIBLES).map(li).join('') + '</ul></details>' : '')) +
  '</div>';
}

/** Semestre UABC de una fecha: enero–junio = "-1", julio–diciembre = "-2". */
function metSemestre(ms) { var d = new Date(ms); return d.getFullYear() + (d.getMonth() < 6 ? '-1' : '-2'); }

function metRangoSemestre(sem) { // "2026-2" → { desde: '2026-07-01', hasta: '2026-12-31' }
  var y = sem.slice(0, 4), uno = sem.slice(5) === '1';
  return { desde: y + (uno ? '-01-01' : '-07-01'), hasta: y + (uno ? '-06-30' : '-12-31') };
}

/** Selector de semestre: llena Desde/Hasta; si las fechas no son un semestre exacto, muestra "Personalizado". */
function metSelectorSemestre() {
  var per = estado.periodo.metricas, vistos = {};
  if (MET.datos) MET.datos.solicitudes.concat(MET.datos.articulos).forEach(function (x) {
    var t = fechaEnMs(x.fecha);
    if (!isNaN(t)) vistos[metSemestre(t)] = true;
  });
  var semestres = Object.keys(vistos).sort().reverse();
  var actual = !per.desde && !per.hasta ? '' : (semestres.filter(function (sm) {
    var r = metRangoSemestre(sm); return r.desde === per.desde && r.hasta === per.hasta;
  })[0] || 'personalizado');
  return '<label>Semestre<select data-semestre>' +
    '<option value="">Todos</option>' +
    semestres.map(function (sm) { return '<option value="' + sm + '"' + (actual === sm ? ' selected' : '') + '>' + sm + '</option>'; }).join('') +
    (actual === 'personalizado' ? '<option value="personalizado" selected>Personalizado</option>' : '') +
  '</select></label>';
}

/* De dónde viene cada artículo. Orden y colores fijos, revisados para daltonismo (verde, naranja, azul,
   amarillo: no quedan juntos dos parecidos). NOTA: el amarillo tiene poco contraste, por eso cada color
   va siempre con su nombre y su número. */
var MET_GRUPOS = [
  { clave: 'uabc', texto: 'UABC', color: '#00723f' },
  { clave: 'otra', texto: 'Otra institución', color: '#eb6834' },
  { clave: 'indep', texto: 'Independiente', color: '#2a78d6' },
  { clave: 'ciad', texto: 'CIAD', color: '#eda100' },
  { clave: 'sin', texto: 'Sin solicitud vinculada', color: '#a3adb8' }
];

function metGrupo(vinculo) {
  var v = String(vinculo || '').trim();
  if (!v) return 'sin';
  if (v === 'CIAD') return 'ciad';
  if (/^uabc/i.test(v)) return 'uabc';
  if (/independiente/i.test(v)) return 'indep';
  return 'otra';
}

/** { uabc: n, otra: n, … } */
function metCuentaGrupos(lista) {
  var c = {};
  lista.forEach(function (x) { var g = metGrupo(x.vinculo); c[g] = (c[g] || 0) + 1; });
  return c;
}

/** Filas para metBarras, con el color de cada grupo; de mayor a menor. */
function metFilasGrupo(lista) {
  var c = metCuentaGrupos(lista);
  return MET_GRUPOS.filter(function (g) { return c[g.clave]; })
    .map(function (g) { return { texto: g.texto, n: c[g.clave], color: g.color }; })
    .sort(function (a, b) { return b.n - a.n; });
}

function metLeyenda(lista) {
  var c = metCuentaGrupos(lista);
  return '<div class="met-leyenda">' + MET_GRUPOS.filter(function (g) { return c[g.clave]; }).map(function (g) {
    return '<span><i style="background:' + g.color + '"></i>' + esc(g.texto) + ' <b>' + c[g.clave] + '</b></span>';
  }).join('') + '</div>';
}

/** Una sola barra horizontal dividida por grupo (la tarjeta grande de publicados). */
function metBarraPartida(lista) {
  var c = metCuentaGrupos(lista);
  return '<div class="met-partida">' + MET_GRUPOS.filter(function (g) { return c[g.clave]; }).map(function (g) {
    return '<i style="flex:' + c[g.clave] + ';background:' + g.color + '" title="' + esc(g.texto + ': ' + c[g.clave] + ' (' + metPct(c[g.clave], lista.length) + ')') + '"></i>';
  }).join('') + '</div>';
}

/** Columnas apiladas por grupo, de la primera a la última fecha (los periodos vacíos se ven en cero).
 *  clave(ms) → número consecutivo; etiqueta(número) → texto. */
function metApiladas(lista, clave, etiqueta) {
  var cuenta = {};
  lista.forEach(function (x) {
    var t = fechaEnMs(x.fecha);
    if (isNaN(t)) return;
    var k = clave(t), g = metGrupo(x.vinculo);
    cuenta[k] = cuenta[k] || { total: 0 };
    cuenta[k][g] = (cuenta[k][g] || 0) + 1;
    cuenta[k].total++;
  });
  var claves = Object.keys(cuenta).map(Number);
  if (!claves.length) return '<p>Sin datos en este periodo.</p>';
  var desde = Math.min.apply(null, claves), hasta = Math.max.apply(null, claves);
  var max = Math.max.apply(null, claves.map(function (k) { return cuenta[k].total; }));
  var html = '';
  for (var k = desde; k <= hasta; k++) {
    var c = cuenta[k] || { total: 0 }, nombre = etiqueta(k);
    var detalle = MET_GRUPOS.filter(function (g) { return c[g.clave]; }).map(function (g) { return g.texto + ' ' + c[g.clave]; }).join(' · ');
    html += '<div class="met-mes" title="' + esc(nombre + ': ' + c.total + (detalle ? ' — ' + detalle : '')) + '"><b>' + (c.total || '') + '</b>' +
      '<div class="met-pila" style="height:' + (c.total * 100 / max) + '%">' +
        MET_GRUPOS.filter(function (g) { return c[g.clave]; }).map(function (g) {
          return '<i style="flex:' + c[g.clave] + ';background:' + g.color + '"></i>';
        }).join('') +
      '</div><span>' + esc(nombre) + '</span></div>';
  }
  return '<div class="met-meses">' + html + '</div>';
}

function metMeses(lista) {
  var MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  return metApiladas(lista,
    function (t) { var d = new Date(t); return d.getFullYear() * 12 + d.getMonth(); },
    function (k) { return MES[k % 12] + ' ' + String(Math.floor(k / 12)).slice(2); });
}

function metSemestres(lista) {
  return metApiladas(lista,
    function (t) { var d = new Date(t); return d.getFullYear() * 2 + (d.getMonth() < 6 ? 0 : 1); },
    function (k) { return Math.floor(k / 2) + '-' + (k % 2 + 1); });
}

function metPeriodoTexto() {
  var per = estado.periodo.metricas, f = function (iso) { return iso.split('-').reverse().join('/'); };
  if (!per.desde && !per.hasta) return 'todo el historial';
  return (per.desde ? 'del ' + f(per.desde) : 'desde el inicio') + (per.hasta ? ' al ' + f(per.hasta) : ' a hoy');
}

function pintarMetricas() {
  var lista = document.getElementById('lista');
  if (MET.error) {
    lista.innerHTML = '<div class="mensaje-lista error">No se pudieron cargar las métricas: ' + esc(MET.error) +
      '<br><br><button class="boton secundario" data-met="actualizar" type="button">Reintentar</button></div>';
    return;
  }
  if (!MET.datos) { lista.innerHTML = '<div class="mensaje-lista">Cargando métricas…</div>'; metCargar(); return; }

  var soloPublicados = estado.filtro.metricas === 'publicado';
  var sol = ordenarYFiltrarPorFecha(MET.datos.solicitudes, 'metricas', 'fecha');
  var todos = ordenarYFiltrarPorFecha(MET.datos.articulos, 'metricas', 'fecha');
  var cuenta = function (l, tipo) { return l.filter(function (x) { return x.tipo === tipo; }).length; };
  var publicados = cuenta(todos, 'publicado');
  var aprobadas = sol.filter(function (x) { return x.estado === 'Aprobada'; }).length;
  var arts = soloPublicados ? todos.filter(function (x) { return x.tipo === 'publicado'; }) : todos;
  var deQue = soloPublicados ? 'artículos publicados' : 'artículos recibidos';
  var cifra = function (n, texto) { return '<div class="mt-cifra"><b>' + n + '</b><span>' + texto + '</span></div>'; };
  var externas = function (x) { return { organizacion: metGrupo(x.vinculo) === 'otra' ? x.organizacion : '' }; };
  var deUabc = arts.filter(function (x) { return metGrupo(x.vinculo) === 'uabc'; });
  var naranja = MET_GRUPOS[1].color, verde = MET_GRUPOS[0].color;
  var conColor = function (filas, color) { return filas.map(function (f) { f.color = color; return f; }); };

  // Tarjeta grande: siempre todo lo publicado, sin filtros ni periodo
  var historico = MET.datos.articulos.filter(function (x) { return x.tipo === 'publicado'; });
  var html = '<div class="solo-impresion"><b>Panel CIAD · Métricas del blog</b><br>Periodo: ' + esc(metPeriodoTexto()) +
      ' · Gráficas de ' + (soloPublicados ? 'artículos publicados' : 'todos los artículos recibidos') +
      ' · Generado el ' + esc(new Date().toLocaleString('es-MX')) + '</div>' +
    '<div class="tarjeta met-heroe"><div class="met-heroe-cifra"><b>' + historico.length + '</b>' +
      '<span>artículos publicados en el blog<br><small>Desde el inicio · no cambia con los filtros</small></span></div>' +
      (historico.length ? metBarraPartida(historico) + metLeyenda(historico) : '') +
    '</div>';

  html += '<div class="tarjeta"><div class="mt-cabecera"><div><h2>Métricas del periodo: ' + esc(metPeriodoTexto()) + '</h2><p>' +
      'Datos de las hojas de solicitudes y de artículos. Las fechas son las del envío del formulario' + (MET.hora ? ' · actualizado: ' + esc(MET.hora) : '') + '</p></div>' +
      '<div class="mt-botones">' +
        '<button class="boton secundario" data-met="pdf" type="button" title="Se abre la ventana de impresión: en Destino elige «Guardar como PDF»">Descargar PDF</button>' +
        '<button class="boton secundario" data-met="actualizar" type="button"' + (MET.cargando ? ' disabled' : '') + '>' +
        (MET.cargando ? 'Actualizando…' : 'Actualizar') + '</button></div></div>' +
    '<div class="mt-cifras">' +
      cifra(sol.length, 'Solicitudes recibidas') +
      cifra(aprobadas, 'Solicitudes aprobadas (' + metPct(aprobadas, sol.length) + ')') +
      cifra(todos.length, 'Artículos recibidos') +
      cifra(publicados, 'Publicados (' + metPct(publicados, todos.length) + ' de los recibidos)') +
      cifra(cuenta(todos, 'revision') + cuenta(todos, 'vincular'), 'Por revisar o vincular') +
      cifra(cuenta(todos, 'rechazado') + cuenta(todos, 'eliminado'), 'Rechazados o eliminados') +
    '</div></div>';

  html += '<div class="met-rejilla">' +
    metBarras('Por vínculo', 'De dónde vienen los ' + deQue + '.', metFilasGrupo(arts)) +
    metBarras('UABC · por unidad académica', 'Solo ' + deQue + ' de la UABC: facultad o escuela.', conColor(metContar(deUabc, 'unidad'), verde)) +
    metBarras('UABC · por programa educativo', 'Solo ' + deQue + ' de la UABC: programa del autor.', conColor(metContar(deUabc, 'programa'), verde)) +
    metBarras('Otras instituciones', 'Escuelas y organizaciones fuera de la UABC.', conColor(metContar(arts.map(externas), 'organizacion'), naranja)) +
    metBarras('Por sección del blog', 'Sección asignada al publicar (o la que pidió el autor).', metContar(arts, 'seccion')) +
    metBarras('Solicitudes por vínculo', 'Todas las solicitudes del periodo, aprobadas o no.', metFilasGrupo(sol)) +
  '</div>';

  var deQueTitulo = soloPublicados ? 'Artículos publicados' : 'Artículos recibidos';
  html += '<div class="met-rejilla">' +
    '<div class="tarjeta met-grafica"><h3>' + deQueTitulo + ' por semestre</h3>' +
      '<p>Semestre UABC en que el autor envió su artículo. Semestre 1: enero a junio; semestre 2: julio a diciembre.</p>' +
      metLeyenda(arts) + metSemestres(arts) + '</div>' +
    '<div class="tarjeta met-grafica"><h3>' + deQueTitulo + ' por mes</h3>' +
      '<p>Mes en que el autor envió su artículo. Pasa el cursor por una columna para ver el detalle.</p>' +
      metLeyenda(arts) + metMeses(arts) + '</div>' +
  '</div>';

  lista.innerHTML = html;
}

document.addEventListener('click', function (e) {
  if (e.target.closest('[data-met="actualizar"]')) { metCargar(); pintar(); }
  if (e.target.closest('[data-met="pdf"]')) {
    // El PDF lleva las listas completas; Chrome lo guarda con «Guardar como PDF» en el diálogo de impresión
    document.querySelectorAll('.met-grafica details').forEach(function (d) { d.open = true; });
    window.print();
  }
});
document.addEventListener('change', function (e) {
  var sel = e.target.closest('[data-semestre]');
  if (!sel || sel.value === 'personalizado') return;
  estado.periodo.metricas = sel.value ? metRangoSemestre(sel.value) : { desde: '', hasta: '' };
  pintar();
});
</script>
<script>
// ===== Usuarios: acceso al panel, administradores y avisos por correo (solo administradores) =====
var US = { datos: null, borrador: null, error: '', cargando: false, guardando: false };
var US_AREAS = [['solicitudes', 'Solicitudes'], ['articulos', 'Artículos'], ['comentarios', 'Comentarios']];

function usCargar() {
  if (US.cargando) return;
  US.cargando = true; US.error = '';
  llamar('obtenerUsuarios')
    .then(usRecibir)
    .catch(function (err) { US.error = mensajeError(err); })
    .then(function () { US.cargando = false; if (estado.pestana === 'usuarios') pintar(); });
}

function usRecibir(r) { US.datos = r; US.borrador = JSON.parse(JSON.stringify(r.usuarios)); }
function usSucio() { return !!US.datos && JSON.stringify(US.borrador) !== JSON.stringify(US.datos.usuarios); }

function pintarUsuarios() {
  var lista = document.getElementById('lista');
  if (US.error && !US.datos) {
    lista.innerHTML = '<div class="mensaje-lista error">No se pudieron cargar los usuarios: ' + esc(US.error) +
      '<br><br><button class="boton secundario" data-us="recargar" type="button">Reintentar</button></div>';
    return;
  }
  if (!US.datos) { lista.innerHTML = '<div class="mensaje-lista">Cargando usuarios…</div>'; usCargar(); return; }

  var dis = US.guardando ? ' disabled' : '';
  var soyCiad = US.datos.fijas.indexOf(US.datos.yo) !== -1; // Solo el CIAD decide quién es administrador (el servidor lo exige)
  var filas = US.borrador.map(function (u, i) {
    var fija = US.datos.fijas.indexOf(u.correo) !== -1, yo = u.correo === US.datos.yo;
    var original = US.datos.usuarios.filter(function (o) { return o.correo === u.correo; })[0];
    var esAdminGuardado = !!(original && original.admin); // Un administrador ya guardado solo lo puede quitar el CIAD
    return '<tr>' +
      '<td><div class="us-correo">' + esc(u.correo) + '</div>' +
        (fija ? '<div class="us-nota">Cuenta del CIAD: siempre administradora</div>' : yo ? '<div class="us-nota">Tú</div>' : '') + '</td>' +
      '<td><input type="text" data-us-i="' + i + '" data-us-campo="nombre" value="' + esc(u.nombre) + '" maxlength="80" placeholder="Nombre" aria-label="Nombre de ' + esc(u.correo) + '"' + dis + '></td>' +
      '<td class="centro"><input type="checkbox" data-us-i="' + i + '" data-us-campo="admin"' + (u.admin ? ' checked' : '') +
        (fija || !soyCiad || US.guardando ? ' disabled' : '') + ' aria-label="Administrador: ' + esc(u.correo) + '"' +
        (!soyCiad && !fija ? ' title="Solo la cuenta del CIAD puede cambiar quién es administrador"' : '') + '></td>' +
      US_AREAS.map(function (a) {
        return '<td class="centro"><input type="checkbox" data-us-i="' + i + '" data-us-campo="' + a[0] + '"' + (u.avisos[a[0]] ? ' checked' : '') + dis +
          ' aria-label="Avisos de ' + a[1].toLowerCase() + ': ' + esc(u.correo) + '"></td>';
      }).join('') +
      '<td class="centro">' + (fija || yo || (esAdminGuardado && !soyCiad) ? '' : '<button class="boton peligro" data-us="quitar" data-us-i="' + i + '" type="button"' + dis + '>Quitar</button>') + '</td>' +
    '</tr>';
  }).join('');

  var resumen = US_AREAS.map(function (a) {
    var n = US.borrador.filter(function (u) { return u.avisos[a[0]]; }).length;
    return a[1] + ': ' + n + (n === 1 ? ' persona' : ' personas');
  }).join(' · ');

  lista.innerHTML = '<div class="tarjeta">' +
    '<div class="mt-cabecera"><div><h2>Usuarios y avisos</h2><p>Quién puede abrir el panel, quién lo administra y qué correos recibe cada persona. ' +
      'Solo los administradores ven esta pestaña. Quien no esté en la lista no puede abrir el panel.' +
      (soyCiad ? '' : ' <b>Solo la cuenta del CIAD puede cambiar quién es administrador.</b>') + '</p></div></div>' +
    '<div class="us-tabla-caja"><table class="us-tabla"><thead><tr>' +
      '<th>Cuenta</th><th>Nombre</th><th class="centro">Administrador</th>' +
      US_AREAS.map(function (a) { return '<th class="centro">Aviso: ' + a[1] + '</th>'; }).join('') + '<th></th>' +
    '</tr></thead><tbody>' + filas + '</tbody></table></div>' +
    '<div class="us-agregar"><input type="email" id="us-nuevo" placeholder="correo@uabc.edu.mx" aria-label="Correo de la persona a agregar"' + dis + '>' +
      '<button class="boton secundario" data-us="agregar" type="button"' + dis + '>Agregar persona</button></div>' +
    '<p class="us-nota" style="margin-top:6px">Entra con todos los avisos activados y sin ser administrador. Para abrir el panel necesita una cuenta @uabc.edu.mx.</p>' +
    '<div class="us-pie"><span class="us-resumen">Reciben avisos de ' + esc(resumen) + '</span>' +
      '<div class="mt-botones">' +
        (usSucio() ? '<button class="boton secundario" data-us="descartar" type="button"' + dis + '>Descartar cambios</button>' : '') +
        '<button class="boton principal" data-us="guardar" type="button"' + (usSucio() && !US.guardando ? '' : ' disabled') + '>' +
          (US.guardando ? 'Guardando…' : 'Guardar cambios') + '</button>' +
      '</div></div>' +
  '</div>';
}

document.addEventListener('change', function (e) {
  var el = e.target.closest('[data-us-campo]');
  if (!el || el.type !== 'checkbox') return;
  var u = US.borrador[Number(el.getAttribute('data-us-i'))], campo = el.getAttribute('data-us-campo');
  if (campo === 'admin') u.admin = el.checked; else u.avisos[campo] = el.checked;
  pintar();
});

document.addEventListener('input', function (e) {
  var el = e.target.closest('[data-us-campo="nombre"]');
  if (!el) return;
  US.borrador[Number(el.getAttribute('data-us-i'))].nombre = el.value;
  // Sin volver a pintar (se perdería el cursor): solo se habilita Guardar
  var g = document.querySelector('[data-us="guardar"]');
  if (g) g.disabled = !usSucio();
});

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-us]');
  if (!b) return;
  var accion = b.getAttribute('data-us');
  if (accion === 'recargar') { US.datos = null; US.error = ''; pintar(); }
  if (accion === 'quitar') { US.borrador.splice(Number(b.getAttribute('data-us-i')), 1); pintar(); }
  if (accion === 'descartar') { US.borrador = JSON.parse(JSON.stringify(US.datos.usuarios)); pintar(); }
  if (accion === 'agregar') {
    var campo = document.getElementById('us-nuevo'), correo = campo.value.trim().toLowerCase();
    if (!/^[^@\s,;]+@[^@\s,;]+\.[^@\s,;]+$/.test(correo)) { avisar('Escribe un correo válido.', true); campo.focus(); return; }
    if (US.borrador.some(function (u) { return u.correo === correo; })) { avisar('Esa persona ya está en la lista.', true); return; }
    US.borrador.push({ correo: correo, nombre: '', admin: false, avisos: { solicitudes: true, articulos: true, comentarios: true } });
    pintar();
  }
  if (accion === 'guardar') {
    US.guardando = true; pintar();
    llamar('guardarUsuarios', US.borrador, US.datos.version)
      .then(function (r) { usRecibir(r); avisar('Usuarios guardados. Los avisos ya llegan con la nueva lista.'); })
      .catch(function (err) { avisar(mensajeError(err), true); })
      .then(function () { US.guardando = false; pintar(); });
  }
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.id === 'us-nuevo') { e.preventDefault(); document.querySelector('[data-us="agregar"]').click(); }
});

window.addEventListener('beforeunload', function (e) {
  if (usSucio()) { e.preventDefault(); e.returnValue = ''; }
});
</script>

estado.secciones = INICIO.secciones || [];

if (INICIO.pestana && (INICIO.pestana !== 'usuarios' || INICIO.admin)) estado.pestana = INICIO.pestana; // Enlace de un aviso por correo

cargarTodo().then(function () { setTimeout(precargarPestanas, 500); });
