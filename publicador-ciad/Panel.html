<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --verde: #00723f;
  --verde-oscuro: #005a31;
  --verde-claro: #e6f2ec;
  --amarillo: #f2a900;
  --amarillo-claro: #fdf4dc;
  --rojo: #b3261e;
  --rojo-claro: #fbe9e7;
  --azul-oscuro: #14243a;
  --texto: #1d2a3a;
  --texto-suave: #5d6b7c;
  --borde: #e2e7ed;
  --fondo: #f4f6f8;
  --blanco: #ffffff;
  --radio: 14px;
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: 'Inter', system-ui, sans-serif;
  background: var(--fondo); color: var(--texto); line-height: 1.5; font-size: 14px;
}
button { font: inherit; cursor: pointer; }
a { color: var(--verde); }
[hidden] { display: none !important; }

/* --- Barra superior --- */
.barra-superior {
  background: var(--verde); color: #fff;
  border-bottom: 4px solid var(--amarillo);
}
.barra-contenido {
  max-width: 1100px; margin: 0 auto; padding: 16px 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
.marca { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 22px; margin: 0; }
.marca span { font-weight: 600; opacity: .8; font-size: 15px; margin-left: 8px; }
.sesion { display: flex; align-items: center; gap: 12px; font-size: 13px; }


/* --- Pestañas --- */
.contenedor { max-width: 1100px; margin: 0 auto; padding: 24px; }
.pestanas { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.pestana {
  display: inline-flex; align-items: center; gap: 10px;
  background: var(--blanco); border: 1px solid var(--borde); color: var(--texto-suave);
  border-radius: 12px; padding: 12px 14px; font-weight: 600; font-size: 15px;
}
.pestana.activa { border-color: var(--verde); color: var(--verde); box-shadow: 0 0 0 1px var(--verde) inset; }
.contador {
  min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px;
  background: var(--fondo); color: var(--texto-suave); font-size: 12px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
}
.contador.con-pendientes { background: var(--amarillo); color: var(--azul-oscuro); }

/* --- Filtros --- */
.filtros { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; align-items: flex-end; }
.filtro {
  background: transparent; border: 1px solid var(--borde); color: var(--texto-suave);
  border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 500;
}
.filtro.activo { background: var(--azul-oscuro); border-color: var(--azul-oscuro); color: #fff; }
/* Color según la acción: pendiente = amarillo, aprobado/publicado = verde, rechazado/no publicado = rojo */
.filtro.tono-amarillo { border-color: var(--amarillo); color: #8a5d00; background: var(--amarillo-claro); }
.filtro.tono-verde { border-color: var(--verde); color: var(--verde); background: var(--verde-claro); }
.filtro.tono-rojo { border-color: var(--rojo); color: var(--rojo); background: var(--rojo-claro); }
.filtro.tono-amarillo.activo { background: var(--amarillo); border-color: var(--amarillo); color: var(--azul-oscuro); }
.filtro.tono-verde.activo { background: var(--verde); border-color: var(--verde); color: #fff; }
.filtro.tono-rojo.activo { background: var(--rojo); border-color: var(--rojo); color: #fff; }
.filtro.tono-amarillo, .filtro.tono-verde, .filtro.tono-rojo { border-color: transparent; } /* Sin contorno; el borde queda transparente para no cambiar el tamaño */
.orden-periodo { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-left: 4px; }
.orden-periodo label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--texto-suave); font-weight: 600; }
.orden-periodo select, .orden-periodo input[type="date"] {
  border: 1px solid var(--borde); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px;
  background: var(--blanco); color: inherit; text-transform: none; letter-spacing: normal;
}
.orden-periodo select:focus, .orden-periodo input[type="date"]:focus { outline: none; border-color: var(--verde); box-shadow: 0 0 0 3px rgba(0,114,63,.15); }

/* --- Tarjetas --- */
.lista { display: grid; gap: 14px; }
.tarjeta {
  background: var(--blanco); border: 1px solid var(--borde); border-radius: var(--radio);
  padding: 20px 22px;
}
.tarjeta.spam { border-color: var(--amarillo); box-shadow: 0 0 0 1px var(--amarillo) inset; }
.tarjeta-cabecera { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.folio { font-family: 'Outfit', sans-serif; font-weight: 700; color: var(--azul-oscuro); }
.fecha { color: var(--texto-suave); font-size: 12px; margin-left: auto; }
.pastilla {
  display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600;
  background: var(--fondo); color: var(--texto-suave);
}
.pastilla.pendiente { background: var(--amarillo-claro); color: #8a5d00; }
.pastilla.aprobado { background: var(--verde-claro); color: var(--verde); }
.pastilla.rechazado { background: var(--rojo-claro); color: var(--rojo); }
.pastilla.seccion { background: #eef1f5; color: var(--azul-oscuro); }
.pastilla.aviso { background: var(--amarillo); color: var(--azul-oscuro); }

.tarjeta h3 { font-family: 'Outfit', sans-serif; font-size: 19px; font-weight: 700; color: var(--azul-oscuro); margin: 0 0 8px; line-height: 1.3; }
.datos { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px 20px; margin: 10px 0 12px; }
.dato { font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
.dato b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--texto-suave); font-weight: 600; }
.texto-largo { white-space: pre-wrap; color: var(--texto); margin: 8px 0; }
.texto-largo.recortado { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.ver-mas { background: none; border: 0; color: var(--verde); font-weight: 600; padding: 0; font-size: 13px; }
.nota {
  border-left: 3px solid var(--amarillo); background: var(--amarillo-claro);
  padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: 13px; margin: 10px 0;
}
.detalle-estado { font-size: 12px; color: var(--texto-suave); margin-top: 6px; }
.subtitulo-articulo { color: var(--texto-suave); font-size: 15px; margin: -4px 0 8px; }
/* Imagen principal: los marcos tienen la misma forma que en el blog */
.portada { margin: 16px 0 12px; padding: 16px 18px; border: 1px solid var(--borde); border-radius: 12px; background: #fafbfc; }
.portada.falta { border-color: #e0a100; background: #fff8e6; }
.portada-titulo { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--texto-suave); font-weight: 600; margin-bottom: 12px; }
.portada .ayuda { font-size: 13px; color: var(--texto-suave); margin: 0 0 12px; }
.portada-vistas { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.portada-vista { flex: 1 1 320px; min-width: 0; }
/* Sin editar: las tres vistas en una fila (la de computadora, más ancha) */
.portada:not(.editando) .portada-vistas { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.portada:not(.editando) .pn, .portada:not(.editando) .portada-marco[data-vista="cel"], .portada:not(.editando) .portada-marco[data-vista="tar"] { max-width: none; }
@media (max-width: 760px) { .portada:not(.editando) .portada-vistas { grid-template-columns: minmax(0, 1fr); } }
.portada-vista h4 { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 8px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; color: var(--azul-oscuro); }
.portada.editando .portada-vista { padding: 10px 12px; border: 1px solid var(--borde); border-radius: 10px; background: var(--blanco); }
/* Editando: computadora arriba (vista previa y barras lado a lado); banner y tarjeta abajo, en dos columnas */
.portada.editando .portada-vistas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.portada.editando .portada-vista[data-vista-clave="pc"] { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 560px) minmax(220px, 1fr); column-gap: 14px; align-items: start; }
.portada.editando .portada-vista[data-vista-clave="pc"] > h4, .portada.editando .portada-vista[data-vista-clave="pc"] > .ayuda { grid-column: 1 / -1; }
.portada.editando .portada-vista[data-vista-clave="pc"] .portada-controles { margin-top: 0; }
@media (max-width: 760px) {
  .portada.editando .portada-vistas, .portada.editando .portada-vista[data-vista-clave="pc"] { grid-template-columns: minmax(0, 1fr); }
}
.boton-mini { border: 1px solid var(--borde); background: var(--blanco); border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 600; color: var(--texto-suave); }
.boton-mini:hover { color: var(--verde); border-color: var(--verde); }
.portada .fila-botones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--borde); }
/* Marco = la imagen principal de la nota */
.portada-marco { margin: 0; position: relative; width: 100%; overflow: hidden; border-radius: 8px; }
.en-pruebas { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 1px 6px; margin-left: 4px; border-radius: 999px; background: #fff4d6; color: #7a5a00; vertical-align: middle; }
.portada-marco img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; user-select: none; }
.portada-marco[data-vista="pc"] img { object-fit: contain; }
.portada-marco[data-vista="cel"], .portada-marco[data-vista="tar"] { max-width: 420px; }
.portada.editando .portada-marco[data-vista="cel"], .portada.editando .portada-marco[data-vista="tar"] { max-width: none; }
.portada.editando .portada-marco { touch-action: none; outline: 2px solid var(--verde); outline-offset: 2px; cursor: grab; }
.portada.editando .portada-vista .ayuda { font-size: 12px; margin: 0 0 8px; } /* Y que el contorno del marco no toque el texto */
.portada.editando .portada-marco:active { cursor: grabbing; }
/* Vista previa de la cabecera de la nota en computadora; tamaños en cqw = una nota de ~1000 px de ancho */
.pn { container-type: inline-size; max-width: 420px; padding: 12px; border: 1px solid var(--borde); border-radius: 8px; background: #fff; }
.portada.editando .pn { max-width: 560px; }
.pn-rejilla { display: grid; grid-template-columns: minmax(0, 1fr) 40%; column-gap: 2.8cqw; align-items: start; }
.pn-rejilla .portada-marco { align-self: stretch; min-height: 22cqw; border-radius: 1.2cqw; }
.pn-titulo { margin: 0 0 1cqw; font: 700 2.15cqw/1.3 Bitter, Georgia, serif; color: #00723F; }
.pn-sub { margin: 0 0 1.6cqw; font: italic 400 1.6cqw/1.35 Bitter, Georgia, serif; color: #20419A; }
.pn-ficha { margin: 0 0 2.8cqw; padding: 1.6cqw 2cqw; border-left: .4cqw solid #00723F; border-radius: 0 1.2cqw 1.2cqw 0; background: #f6f8fa; font-size: 1.6cqw; line-height: 1.5; }
.pn-ficha p { margin: 0; }
.pn-ficha p:first-child { font-weight: 700; }
.pn-lectura { margin: 0 0 2.4cqw; font-size: 1.4cqw; color: #5d6b7c; }
.portada-controles { display: grid; grid-template-columns: auto minmax(0, 1fr) 3em; gap: 2px 10px; align-items: center; margin-top: 8px; padding: 6px 10px; border-radius: 8px; background: var(--fondo); }
.portada-controles label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--texto-suave); font-weight: 600; }
.portada-controles input[type="range"] { width: 100%; margin: 0; accent-color: var(--verde); }
.portada-controles input:disabled { opacity: .4; }
.portada-controles output { font-size: 13px; color: var(--texto-suave); text-align: right; font-variant-numeric: tabular-nums; }
.campo-seccion { margin: 12px 0 4px; max-width: 520px; }
.campo-seccion label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--texto-suave); font-weight: 600; margin-bottom: 4px; }
.campo-seccion input[type="text"] {
  width: 100%; font: inherit; font-size: 13px; color: var(--texto);
  border: 1px solid var(--borde); border-radius: 8px; padding: 8px 10px; background: #fff;
}
.campo-seccion input[type="text"]:focus { outline: none; border-color: var(--verde); box-shadow: 0 0 0 3px rgba(0,114,63,.15); }
/* Editar nota publicada: compacto; la barra va junto al texto y el texto se desplaza dentro de su caja */
.edicion { margin: 16px 0 4px; padding: 14px 16px; border: 1px solid var(--borde); border-radius: 12px; background: #fafbfc; }
.edicion-cabeza { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 2px; }
.edicion-cabeza .portada-titulo { margin: 0; }
.edicion .campo-seccion { max-width: none; margin: 8px 0 0; }
.edicion-rejilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0 12px; }
.edicion-rejilla.dos { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
.edicion textarea { width: 100%; font: inherit; font-size: 13px; color: var(--texto); border: 1px solid var(--borde); border-radius: 8px; padding: 8px 10px; background: #fff; resize: vertical; }
.edicion textarea:focus { outline: none; border-color: var(--verde); box-shadow: 0 0 0 3px rgba(0,114,63,.15); }
.edicion .ayuda { font-size: 12px; color: var(--texto-suave); margin: 4px 0 0; }
.edicion .portada { margin: 12px 0 0; background: var(--blanco); }
.editor { border: 1px solid var(--borde); border-radius: 8px; background: #fff; overflow: hidden; }
.editor:focus-within { border-color: var(--verde); box-shadow: 0 0 0 3px rgba(0,114,63,.15); }
.editor-barra { display: flex; flex-wrap: wrap; gap: 2px 10px; padding: 4px 6px; border-bottom: 1px solid var(--borde); background: var(--fondo); }
.editor-grupo { display: inline-flex; gap: 1px; }
.editor-barra button { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 3px 7px; font-size: 12.5px; color: var(--texto); line-height: 1.3; }
.editor-barra button:hover, .editor-barra button:focus-visible { background: #fff; border-color: var(--borde); outline: none; }
.editor-pedir { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--borde); background: var(--amarillo-claro); font-size: 13px; }
.editor-pedir input[type="text"] { flex: 1 1 220px; font: inherit; font-size: 13px; border: 1px solid var(--borde); border-radius: 8px; padding: 5px 9px; background: #fff; }
.editor-pedir .boton { padding: 5px 12px; }
.editor-cuerpo { min-height: 220px; max-height: 60vh; overflow: auto; padding: 12px 16px; font-size: 14px; line-height: 1.6; outline: none; }
.editor-cuerpo img, .editor-cuerpo iframe, .editor-cuerpo figure { max-width: 100%; height: auto; }
.editor-cuerpo .articulo-referencia { font-size: inherit !important; } /* Como en el blog: mismo tamaño que el texto */
.editor-cuerpo .cita-burbuja { display: none; }
.editor-cuerpo h2 { font-family: 'Outfit', sans-serif; font-size: 19px; color: var(--verde); margin: 1.1em 0 .4em; }
.editor-cuerpo h3 { font-family: 'Outfit', sans-serif; font-size: 16px; color: var(--verde); margin: 1em 0 .3em; }
/* Pantalla completa: el editor ocupa toda la ventana, con Guardar y Cancelar a la mano */
.edicion-marco.pantalla-completa { position: fixed; inset: 0; z-index: 1000; overflow: auto; padding: 20px max(20px, calc(50vw - 560px)); background: var(--fondo); }
.edicion-marco.pantalla-completa .edicion { margin-top: 0; background: var(--blanco); }
.edicion-marco.pantalla-completa .editor-cuerpo { max-height: 70vh; min-height: 50vh; }
.edicion-marco.pantalla-completa .acciones { position: sticky; bottom: 0; background: var(--fondo); padding-bottom: 14px; }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px; border: 1px solid var(--borde); border-radius: 8px; background: var(--blanco); cursor: text; }
.chips:focus-within { border-color: var(--verde); box-shadow: 0 0 0 3px rgba(0,114,63,.15); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; border-radius: 999px; background: var(--verde-claro, #e8f3ed); color: var(--verde); font-size: 12px; font-weight: 600; }
.chip button { border: 0; background: transparent; color: inherit; cursor: pointer; font-size: 14px; line-height: 1; padding: 0 4px; border-radius: 50%; }
.chip button:hover { background: rgba(0,114,63,.15); }
.campo-seccion .chips input[type="text"] { flex: 1 0 140px; border: 0; padding: 4px 2px; box-shadow: none; min-width: 120px; }
.campo-seccion .chips input[type="text"]:focus { box-shadow: none; }
.campo-seccion select {
  width: 100%; font: inherit; font-size: 13px; color: var(--texto);
  border: 1px solid var(--borde); border-radius: 8px; padding: 8px 10px; background: #fff;
}
.campo-seccion select:focus { outline: none; border-color: var(--verde); box-shadow: 0 0 0 3px rgba(0,114,63,.15); }
.campo-seccion.con-error select { border-color: var(--rojo); }
.campo-seccion .ayuda { font-size: 12px; color: var(--texto-suave); margin-top: 4px; }
.enlaces { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; font-weight: 600; margin: 8px 0; }

/* --- Acciones --- */
.acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--borde); }
.boton {
  border-radius: 8px; padding: 8px 16px; font-weight: 600; font-size: 13px;
  border: 1px solid transparent; transition: background .15s;
}
.boton:disabled { opacity: .55; cursor: wait; }
/* --- Mantenimiento --- */
.mt-cabecera { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; justify-content: space-between; }
.mt-cabecera h2 { margin: 0; font-size: 18px; }
.mt-cabecera p { margin: 4px 0 0; color: #5d6b7c; font-size: 13px; }
.mt-botones { display: flex; gap: 8px; flex-wrap: wrap; }
.mt-cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 16px; }
.mt-cifra { border: 1px solid var(--borde); border-radius: 10px; padding: 10px 12px; }
.mt-cifra b { display: block; font-size: 20px; line-height: 1.2; }
.mt-cifra span { font-size: 12px; color: #5d6b7c; }
.mt-cifra.liberar b { color: var(--verde); }
.mt-barra-uso { height: 8px; border-radius: 999px; background: #eef1f4; overflow: hidden; margin-top: 12px; }
.mt-barra-uso i { display: block; height: 100%; background: var(--verde); }
.mt-reglas { margin-top: 12px; font-size: 13px; }
.mt-reglas summary { cursor: pointer; font-weight: 600; }
.mt-reglas ul { margin: 8px 0 0; padding-left: 18px; color: #3d4a5a; }
/* Métricas: una barra por valor; el número y el % van en texto (no dependen del color) */
.met-rejilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 14px; }
.met-rejilla .tarjeta { margin: 0; }

.met-grafica h3 { margin: 0 0 2px; font-size: 15px; }
.met-grafica > p { margin: 0 0 12px; font-size: 12px; color: var(--texto-suave); }
.met-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.met-lista li { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(50px, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; padding: 2px 0; }
.met-lista li:hover { background: var(--fondo); }
.met-etiqueta { overflow-wrap: anywhere; line-height: 1.3; }
.met-barra { height: 10px; }
.met-barra i { display: block; height: 100%; min-width: 2px; background: var(--azul-oscuro); border-radius: 0 4px 4px 0; }
.met-lista b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.met-lista b small { font-weight: 400; color: var(--texto-suave); }
.met-grafica details { margin-top: 8px; font-size: 13px; }
.met-grafica summary { cursor: pointer; font-weight: 600; color: var(--verde); margin-bottom: 6px; }
.met-meses { display: flex; align-items: flex-end; gap: 2px; height: 160px; overflow-x: auto; padding-top: 18px; }
.met-mes { flex: 1 0 28px; max-width: 72px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; font-size: 11px; color: var(--texto-suave); }
.met-mes b { color: var(--texto); font-size: 12px; font-variant-numeric: tabular-nums; }
.met-pila { width: 70%; min-height: 2px; display: flex; flex-direction: column-reverse; gap: 2px; border-radius: 4px 4px 0 0; overflow: hidden; }
.met-pila i { display: block; min-height: 2px; }
.met-mes:hover .met-pila { opacity: .85; }
.met-leyenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; margin: 0 0 8px; color: var(--texto); }

<script>
/**
 * @fileoverview Panel CIAD: interfaz que se ejecuta en el navegador.
 * @author APONTE
 * Capa: Vista. Pide y envía datos al Controlador (PanelServidor.gs) con google.script.run.
 * Los estilos están en el <style> de arriba y el código en varios bloques <script>, uno por área.
 *
 * ===== Estado (datos globales del panel) =====
 */
var FILTROS = {
  solicitudes: [
    { clave: 'pendientes', texto: 'Pendientes', tono: 'amarillo' },
    { clave: 'Aprobada', texto: 'Aprobadas', tono: 'verde' },
    { clave: 'Rechazada', texto: 'Rechazadas', tono: 'rojo' },
    { clave: 'todas', texto: 'Todas' }
  ],
  articulos: [
    { clave: 'revision', texto: 'Por revisar', tono: 'amarillo' },
    { clave: 'publicado', texto: 'Publicados', tono: 'verde' },
    { clave: 'problemas', texto: 'No publicados', tono: 'rojo' },
    { clave: 'todos', texto: 'Todos' }
  ],
  comentarios: [
    { clave: 'pendiente', texto: 'Pendientes', tono: 'amarillo' },
    { clave: 'publicado', texto: 'Publicados', tono: 'verde' },
    { clave: 'rechazado', texto: 'Rechazados', tono: 'rojo' }
  ],
  paginas: [
    // Desactivadas (sin borrar): para reactivarlas, quitar las barras
    // { clave: 'multimedia', texto: 'Multimedia' },
    // { clave: 'guias', texto: 'Guías y tutoriales' },
    { clave: 'inicio', texto: 'Inicio' },
    { clave: 'sobre', texto: 'Sobre el blog' }
  ],
  metricas: [
    { clave: 'publicado', texto: 'Publicados', tono: 'verde' },
    { clave: 'todos', texto: 'Todos los artículos recibidos' }
  ],
  mantenimiento: [],
  guia: [],
  usuarios: []
};

var estado = {
  pestana: 'solicitudes',
  filtro: { solicitudes: 'pendientes', articulos: 'revision', comentarios: 'pendiente', paginas: 'inicio', metricas: 'publicado' },
  // Orden y periodo por pestaña; los valores iniciales respetan el orden que ya tenía cada lista
  orden: { solicitudes: 'recientes', articulos: 'recientes', comentarios: 'antiguos' },
  periodo: { solicitudes: { desde: '', hasta: '' }, articulos: { desde: '', hasta: '' }, comentarios: { desde: '', hasta: '' }, metricas: { desde: '', hasta: '' } },
  datos: { solicitudes: null, articulos: null, comentarios: null },
  secciones: [],
  elecciones: {},   // Secciones o solicitudes elegidas y aún sin enviar (se conservan al recargar)
  portadas: {},     // fila → { src, datos, nw, nh, pc, cel }: imagen principal en ajuste, aún sin guardar
  ediciones: {},    // fila → { titulo, subtitulo, ficha, cuerpo, cuerpoNuevo }: nota publicada en edición, aún sin guardar
  cabeceras: {},    // postId → { titulo, subtitulo, ficha, lectura } de la nota real (vista previa de la imagen principal)
  errores: {}
};

// ===== Utilidades =====
function llamar(funcion) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolver, rechazar) {
    var r = google.script.run.withSuccessHandler(resolver).withFailureHandler(rechazar);
    r[funcion].apply(r, args);
  });
}

function esc(t) {
  return String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function dosDigitos(n) { return (n < 10 ? '0' : '') + n; }

/** 23/09/2026 14:05 */
function fechaLegible(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d)) return iso;
  return dosDigitos(d.getDate()) + '/' + dosDigitos(d.getMonth() + 1) + '/' + d.getFullYear() +
    ' ' + dosDigitos(d.getHours()) + ':' + dosDigitos(d.getMinutes());
}

/** Milisegundos de "dd/MM/yyyy HH:mm" (hojas) o ISO (comentarios); NaN si no se entiende. */
function fechaEnMs(texto) {
  var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/.exec(String(texto || '').trim());
  if (m) return new Date(+m[3], m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0)).getTime();
  return texto ? new Date(texto).getTime() : NaN;
}

/** Aplica el periodo (Desde/Hasta, días completos) y el orden elegidos en la pestaña. */
function ordenarYFiltrarPorFecha(lista, pestana, campo) {
  var per = estado.periodo[pestana];
  var desde = per.desde ? new Date(per.desde + 'T00:00:00').getTime() : -Infinity;
  var hasta = per.hasta ? new Date(per.hasta + 'T23:59:59.999').getTime() : Infinity;
  var signo = estado.orden[pestana] === 'antiguos' ? 1 : -1;
  return lista.filter(function (x) {
    if (!per.desde && !per.hasta) return true;
    var t = fechaEnMs(x[campo]);
    return !isNaN(t) && t >= desde && t <= hasta;
  }).sort(function (a, b) {
    var ta = fechaEnMs(a[campo]), tb = fechaEnMs(b[campo]);
    if (isNaN(ta)) return 1;   // Sin fecha: siempre al final
    if (isNaN(tb)) return -1;
    return (ta - tb) * signo;
  });
}

function controlesOrdenPeriodo(p) {
  var per = estado.periodo[p];
  return '<div class="orden-periodo">' +
    (!estado.orden[p] ? (p === 'metricas' ? metSelectorSemestre() : '') : '<label>Orden<select data-orden>' + // Métricas: semestre en lugar de orden
      '<option value="recientes"' + (estado.orden[p] === 'recientes' ? ' selected' : '') + '>Más recientes primero</option>' +
      '<option value="antiguos"' + (estado.orden[p] === 'antiguos' ? ' selected' : '') + '>Más antiguos primero</option>' +
    '</select></label>') +
    '<label>Desde<input type="date" data-periodo="desde" value="' + esc(per.desde) + '"' + (per.hasta ? ' max="' + esc(per.hasta) + '"' : '') + '></label>' +
    '<label>Hasta<input type="date" data-periodo="hasta" value="' + esc(per.hasta) + '"' + (per.desde ? ' min="' + esc(per.desde) + '"' : '') + '></label>' +
    (per.desde || per.hasta ? '<button class="filtro" data-quitar-periodo type="button">Quitar periodo</button>' : '') +
  '</div>';
}

var temporizadorAviso;
function avisar(texto, esError) {
  var aviso = document.getElementById('aviso');
  aviso.textContent = texto;
  aviso.className = 'aviso-flotante visible' + (esError ? ' error' : '');
  clearTimeout(temporizadorAviso);
  temporizadorAviso = setTimeout(function () { aviso.className = 'aviso-flotante'; }, esError ? 7000 : 4000);
}

function mensajeError(err) {
  var texto = (err && err.message ? err.message : String(err)).replace(/^(Exception|Error|ScriptError):\s*/, '');
  // Sesión de Google vencida o conexión perdida: google.script.run no llega al servidor
  if (/Authorization is required|Se necesita autorización|NetworkError|HTTP 0|Failed to fetch|PERMISSION_DENIED|la sesión ha caducado/i.test(texto)) {
    return 'Se perdió la conexión o tu sesión de Google expiró. Recarga el panel (F5); si sigue, cierra sesión y vuelve a entrar. No se guardó ningún cambio.';
  }
  if (/We're sorry, a server error occurred|Lo sentimos, se ha producido un error del servidor/i.test(texto)) {
    return 'Google Apps Script tuvo una falla temporal. Espera un momento e inténtalo de nuevo.';
  }
  return texto;
}

function dato(etiqueta, valor) {
  return valor ? '<div class="dato"><b>' + esc(etiqueta) + '</b>' + esc(valor) + '</div>' : '';
}

function textoLargo(texto) {
  if (!texto) return '';
  var largo = texto.length > 320;
  return '<p class="texto-largo' + (largo ? ' recortado' : '') + '">' + esc(texto) + '</p>' +
    (largo ? '<button class="ver-mas" type="button" data-accion="ver-mas">Ver completo</button>' : '');
}

// ===== Carga de datos =====
function pedirDatos(pestana) {
  if (pestana === 'solicitudes') return llamar('obtenerSolicitudes');
  if (pestana === 'articulos') return llamar('obtenerArticulos');
  return llamar('obtenerComentarios', estado.filtro.comentarios);
}

function cargar(pestana) {
  estado.errores[pestana] = null;
  return pedirDatos(pestana)
    .then(function (datos) { estado.datos[pestana] = datos; })
    .catch(function (err) { estado.errores[pestana] = mensajeError(err); })
    .then(function () { actualizarContadores(); if (estado.pestana === pestana) pintar(); });
}

// --- Recarga automática ---
var RECARGA_CADA_MS = 30000;
var recargando = false;

/** true si el usuario está a mitad de algo que una recarga borraría. */
function hayInteraccion() {
  if (document.querySelector('.confirmacion') || Object.keys(estado.portadas).length || Object.keys(estado.ediciones).length) return true;
  var activo = document.activeElement;
  return !!(activo && /^(TEXTAREA|INPUT)$/.test(activo.tagName));
}

/** Recarga sin "Cargando…": solo vuelve a pintar si algo cambió y el usuario no está ocupado. */
function cargarEnSilencio(pestana) {
  var comentariosFiltro = estado.filtro.comentarios;
  return pedirDatos(pestana).then(function (datos) {
    if (pestana === 'comentarios' && comentariosFiltro !== estado.filtro.comentarios) return; // Cambió de filtro mientras tanto
    var cambio = JSON.stringify(datos) !== JSON.stringify(estado.datos[pestana]);
    estado.errores[pestana] = null;
    estado.datos[pestana] = datos;
    actualizarContadores();
    if (cambio && estado.pestana === pestana && !hayInteraccion()) {
      var scroll = window.scrollY;
      pintar();
      window.scrollTo(0, scroll);
    }
  });
}

/* OPT: en cada vuelta se recarga solo la pestaña abierta; las demás (para los contadores), cada 3 vueltas.
   Tampoco se recarga mientras hay una acción en curso (publicar, rechazar…), para no competir con ella
   en el servidor. */
var vueltaRecarga = 0;
var accionesEnCurso = 0;

function recargarAutomatico() {
  if (recargando || accionesEnCurso || document.hidden || hayInteraccion()) return;
  recargando = true;
  vueltaRecarga++;
  var todas = ['solicitudes', 'articulos', 'comentarios'];
  var pestanas = vueltaRecarga % 3 === 0 ? todas : todas.filter(function (p) { return p === estado.pestana; });
  Promise.all(pestanas.map(cargarEnSilencio))
    .catch(function () { /* Sin aviso: se reintenta en la siguiente vuelta */ })
    .then(function () { recargando = false; });
}

setInterval(recargarAutomatico, RECARGA_CADA_MS);

// Al volver a la pestaña del navegador, se actualiza de inmediato
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) recargarAutomatico();
});

function cargarTodo() {
  ['solicitudes', 'articulos', 'comentarios'].forEach(function (p) { estado.datos[p] = null; });
  pintar();
  return Promise.all([cargar('solicitudes'), cargar('articulos'), cargar('comentarios')]);
}

function actualizarContadores() {
  var s = estado.datos.solicitudes, a = estado.datos.articulos, c = estado.datos.comentarios;
  poner('contador-solicitudes', s ? s.filter(function (x) { return !x.respondida; }).length : (estado.errores.solicitudes ? '!' : '…'));
  poner('contador-articulos', a ? a.filter(function (x) { return x.tipo === 'revision' || x.tipo === 'vincular'; }).length : (estado.errores.articulos ? '!' : '…'));
  if (estado.filtro.comentarios === 'pendiente') {
    poner('contador-comentarios', c ? c.comentarios.length : (estado.errores.comentarios ? '!' : '…'));
  }
  function poner(id, n) {
    var el = document.getElementById(id);
    el.textContent = n;
    el.className = 'contador' + (typeof n === 'number' && n > 0 ? ' con-pendientes' : '');
  }
}

// ===== Pintar (generar el HTML de cada pestaña) =====
function pintar() {
  var p = estado.pestana;

  document.querySelectorAll('.pestana').forEach(function (b) {
    b.classList.toggle('activa', b.getAttribute('data-pestana') === p);
  });

  // En Páginas no hay filtros: la lista de páginas va en el menú lateral del editor
  document.getElementById('filtros').innerHTML = p === 'paginas' ? '' : FILTROS[p].map(function (f) {
    return '<button class="filtro' + (f.tono ? ' tono-' + f.tono : '') + (estado.filtro[p] === f.clave ? ' activo' : '') + '" data-filtro="' + f.clave + '" type="button">' + f.texto + '</button>';
  }).join('') + (estado.periodo[p] ? controlesOrdenPeriodo(p) : '');

  var lista = document.getElementById('lista');
  var extra = document.getElementById('extra');
  extra.innerHTML = '';

  if (p === 'paginas') { pintarPaginas(); return; }
  if (p === 'guia') { pintarGuia(); return; }
  if (p === 'mantenimiento') { pintarMantenimiento(); return; }
  if (p === 'metricas') { pintarMetricas(); return; }
  if (p === 'usuarios') { pintarUsuarios(); return; }

  if (estado.errores[p]) {
    lista.innerHTML = '<div class="mensaje-lista error">No se pudo cargar: ' + esc(estado.errores[p]) + '</div>';
    return;
  }
  if (!estado.datos[p]) {
    lista.innerHTML = '<div class="mensaje-lista">Cargando…</div>';
    return;
  }

  var html = '';
  if (p === 'solicitudes') html = pintarSolicitudes();
  if (p === 'articulos') html = pintarArticulos();
  if (p === 'comentarios') { html = pintarComentarios(); extra.innerHTML = pintarBloqueados(); }

  lista.innerHTML = html || '<div class="mensaje-lista">No hay nada aquí por ahora.</div>';
}

// --- Solicitudes ---
function pintarSolicitudes() {
  var f = estado.filtro.solicitudes;
  return ordenarYFiltrarPorFecha(estado.datos.solicitudes, 'solicitudes', 'fecha').filter(function (s) {
    if (f === 'pendientes') return !s.respondida;
    if (f === 'todas') return true;
    return s.respondida && s.estado === f;
  }).map(function (s, i) {
    var clase = s.respondida ? (s.estado === 'Aprobada' ? 'aprobado' : 'rechazado') : 'pendiente';
    var detalleVinculo = s.vinculo === 'UABC'
      ? [s.unidad, s.programa].filter(Boolean).join(' · ')
      : s.organizacion;

    return '<article class="tarjeta" data-tipo="solicitud" data-fila="' + s.fila + '" data-firma="' + esc(s.firma) + '">' +
      '<div class="tarjeta-cabecera">' +
        '<span class="folio">' + esc(s.folio || 'Sin folio') + '</span>' +
        '<span class="pastilla ' + clase + '">' + esc(s.respondida ? s.estado : 'Pendiente') + '</span>' +
        (s.seccion ? '<span class="pastilla seccion">Sugerida: ' + esc(s.seccion) + '</span>' : '') +
        '<span class="fecha">' + esc(s.fecha) + '</span>' +
      '</div>' +
      '<h3>' + esc(s.titulo || '(sin título)') + '</h3>' +
      '<div class="datos">' +
        dato('Autor', s.nombre) + dato('Correo', s.correo) +
        dato('Vínculo', s.vinculo) + dato(s.vinculo === 'UABC' ? 'Unidad y programa' : 'Organización', detalleVinculo) +
      '</div>' +
      textoLargo(s.resumen) +
      (s.nota ? '<div class="nota"><b>Nota del moderador:</b> ' + esc(s.nota) + '</div>' : '') +
      (s.respondida
        ? '<p class="detalle-estado">Respuesta enviada: ' + esc(s.respuesta) + (s.moderador ? ' · por ' + esc(s.moderador) : '') + '</p>'
        : '<div class="acciones">' +
            '<button class="boton principal" data-accion="aprobar-solicitud" type="button">Aprobar</button>' +
            '<button class="boton peligro" data-accion="rechazar-solicitud" type="button">Rechazar</button>' +
            (s.respuesta ? '<span class="detalle-estado">' + esc(s.respuesta) + '</span>' : '') +
          '</div>') +
    '</article>';
  }).join('');
}

// --- Artículos ---
function pintarArticulos() {
  var f = estado.filtro.articulos;
  var nombres = { revision: 'Por revisar', vincular: 'Por vincular', publicado: 'Publicado', eliminado: 'Eliminado', rechazado: 'Rechazado', error: 'Error', procesando: 'Procesando' };
  var clases = { revision: 'pendiente', vincular: 'aviso', publicado: 'aprobado', eliminado: 'rechazado', rechazado: 'rechazado', error: 'rechazado', procesando: '' };

  return ordenarYFiltrarPorFecha(estado.datos.articulos, 'articulos', 'fecha').filter(function (a) {
    if (f === 'todos') return true;
    if (f === 'problemas') return a.tipo === 'rechazado' || a.tipo === 'error' || a.tipo === 'eliminado';
    if (f === 'revision') return a.tipo === 'revision' || a.tipo === 'vincular';

  }).map(function (a) {
    var acciones = '';
    var botonReconvertir = '<button class="boton secundario" data-accion="reconvertir-articulo" type="button" title="En pruebas: borra el contenido actual de la entrada y lo vuelve a crear a partir del Word original">Rehacer <span class="en-pruebas">en pruebas</span></button>';
    var botonCopia = '<button class="boton peligro" data-accion="eliminar-copia" type="button" title="Es una copia: no se avisa a nadie y la original no cambia">Eliminar copia</button>';
    var editable = (a.tipo === 'revision' || a.tipo === 'publicado') && a.postId;
    var botonesNota = '<button class="boton secundario" data-accion="editar-nota" type="button">Editar nota</button>' +
      '<button class="boton secundario" data-accion="clonar-nota" type="button" title="Copia como borrador para cambiarle algo y publicarla aparte">Clonar</button>';
    if (editable && estado.ediciones[a.fila]) {
      acciones = '<div class="edicion-marco' + (estado.ediciones[a.fila].completa ? ' pantalla-completa' : '') + '">' + bloqueEdicion(a) + '<div class="acciones">' +
        '<button class="boton principal" data-accion="guardar-nota" type="button">Guardar cambios</button>' +
        '<button class="boton secundario" data-accion="cancelar-edicion" type="button">Cancelar</button></div></div>';
    } else if (a.tipo === 'revision') {
      acciones = '<div class="acciones">' +
        '<button class="boton principal" data-accion="publicar-articulo" type="button"' + (a.portada ? '' : ' disabled title="Falta la imagen principal"') + '>Publicar</button>' +
        (a.clonDe ? botonCopia : '<button class="boton peligro" data-accion="rechazar-articulo" type="button">Rechazar</button>') +
        (a.postId ? botonesNota : '') + (a.documento ? botonReconvertir : '') +
      '</div>';
    } else if (a.tipo === 'vincular') {
      acciones = '<div class="acciones">' +
        '<button class="boton principal" data-accion="vincular-articulo" type="button">Vincular y crear borrador</button>' +
        '<button class="boton peligro" data-accion="descartar-articulo" type="button">Descartar</button>' +
      '</div>';
    } else if (a.tipo === 'publicado' && a.postId) {
      acciones = '<div class="acciones">' + botonesNota +
        (a.clonDe ? botonCopia : '<button class="boton peligro" data-accion="eliminar-articulo" type="button">Eliminar del blog</button>') +
        (a.documento ? botonReconvertir : '') + '</div>';
    } else if (a.tipo === 'error' || (a.tipo === 'procesando' && Date.now() - fechaEnMs(a.fecha) > 10 * 60 * 1000)) {
      // "Procesando" por más de 10 min = el disparador no corrió o se cortó; Reintentar procesa solo esta fila
      acciones = '<div class="acciones"><button class="boton secundario" data-accion="reintentar-articulo" type="button">Reintentar</button></div>';
    }

    return '<article class="tarjeta" data-tipo="articulo" data-fila="' + a.fila + '" data-post="' + esc(a.postId) + '">' +

      '<div class="datos">' + dato('Autor(es)', a.autor) + dato('Correo', a.correo) +

        (a.carpeta ? '<a href="' + esc(a.carpeta) + '" target="_blank" rel="noopener">Carpeta ↗</a>' : '') +
        (a.imagenes || []).map(function (url, i) {
          return '<a href="' + esc(url) + '" target="_blank" rel="noopener">Imagen ' + (i + 1) + ' ↗</a>';
        }).join('') +
        (a.tipo === 'revision' && a.enlaceBorrador ? '<a href="' + esc(a.enlaceBorrador) + '" target="_blank" rel="noopener">Editar en Blogger ↗</a>' : '') +
        (a.enlacePublicado ? '<a href="' + esc(a.enlacePublicado) + '" target="_blank" rel="noopener">Ver en el blog ↗</a>' : '') +
      '</div>' +
      (a.nota ? '<div class="nota"><b>Nota del moderador:</b> ' + esc(a.nota) + '</div>' : '') +
      (a.editada ? '<p class="detalle-estado">Editada en el panel: ' + esc(a.editada) + '</p>' : '') +
      (a.clonDe ? '<p class="detalle-estado">Copia de ' + (/^https?:/.test(a.clonDe) ? '<a href="' + esc(a.clonDe) + '" target="_blank" rel="noopener">otra nota ↗</a>' : 'otra nota') + '</p>' : '') +
      (a.tipo !== 'revision' && a.estado ? '<p class="detalle-estado">' + esc(a.estado) + '</p>' : '') +
      acciones +

// --- Editar nota (publicada o en revisión) ---
function abrirEdicion(filaE, postId) {
  return llamar('notaParaEditar', Number(filaE), postId).then(function (d) {
    d.cuerpo = d.cuerpo === null ? null : htmlLimpio(d.cuerpo);
    d.cuerpoNuevo = null; // Solo se envía si se tocó: así el texto no cambia por guardar el título
    d.historial = [{ html: d.cuerpo, cursor: null }]; d.paso = 0;
    estado.ediciones[filaE] = d;
    var artE = articuloDeFila(filaE);
    if (artE && artE.portada && !estado.portadas[filaE]) { // La imagen principal también se ajusta aquí
      abrirPortada(filaE, 'https://drive.google.com/thumbnail?id=' + artE.portada + '&sz=w1600', '', artE.encuadrePc, artE.encuadreCelular, artE.postId, artE.encuadreTarjeta);
    }
    delete estado.elecciones['seccion-' + filaE]; // Parten de lo que ya tiene la nota
    delete estado.elecciones['etiquetas-' + filaE];
    pintar();
  });
}

function bloqueEdicion(a) {
  var ed = estado.ediciones[a.fila];
  var campo = function (clave, etiqueta, valor, largo) {
    var id = 'ed-' + a.fila + '-' + clave.replace('.', '-');
    return '<div class="campo-seccion"><label for="' + id + '">' + etiqueta + '</label>' + (largo
      ? '<textarea id="' + id + '" data-editar="' + clave + '" rows="2">' + esc(valor) + '</textarea>'
      : '<input type="text" id="' + id + '" data-editar="' + clave + '" value="' + esc(valor) + '">') + '</div>';
  };
  return '<div class="edicion">' +
    '<div class="edicion-cabeza"><span class="portada-titulo">' + (a.tipo === 'revision' ? 'Editar borrador' : 'Editar nota publicada') + '</span>' +
      '<button class="boton secundario" type="button" data-formato="completa" aria-pressed="' + !!ed.completa + '">' + (ed.completa ? 'Salir de pantalla completa' : '⛶ Pantalla completa') + '</button></div>' +
    campo('titulo', 'Título', ed.titulo) +
    campo('subtitulo', 'Subtítulo (va en azul bajo el título)', ed.subtitulo, true) +
    '<div class="edicion-rejilla">' + [['nombre', 'Autor(es)'], ['fecha', 'Fecha'], ['correo', 'Correo de contacto'], ['cargo', 'Cargo'], ['vinculo', 'Vínculo']]
      .map(function (q) { return campo('ficha.' + q[0], q[1], ed.ficha[q[0]]); }).join('') + '</div>' +
    '<div class="edicion-rejilla dos">' +
      selectorSeccion(a.seccionAsignada || a.seccionSugerida, a.fila, a.tipo === 'revision' ? 'La que tendrá al publicarla. Puedes cambiarla.' : 'Si la cambias, la nota se mueve al guardar.') +
        campoEtiquetas(a.etiquetasAsignadas || a.etiquetasSugeridas, a.fila) +
    '</div>' +
    bloquePortada(a) +
    (ed.cuerpo === null
      ? '<p class="ayuda">No encontré el texto de esta nota; para cambiarlo usa «Rehacer».</p>'
      : '<div class="campo-seccion"><label id="ed-' + a.fila + '-cuerpo">Texto de la nota</label>' +
        '<div class="editor">' +
          '<div class="editor-barra" role="toolbar" aria-label="Formato del texto">' + BARRA_EDITOR.map(function (grupo) {
            return '<span class="editor-grupo">' + grupo.map(function (b) {
              return '<button type="button" data-formato="' + b[0] + '" title="' + b[2] + '" aria-label="' + b[2] + '">' + b[1] + '</button>';
            }).join('') + '</span>';
          }).join('') + '<input type="file" accept="image/*" data-imagen-nota hidden></div>' +
          '<div class="editor-pedir" data-pedir hidden><label></label><input type="text"><button class="boton principal" type="button" data-pedir-aceptar>Aplicar</button>' +
            '<button class="boton secundario" type="button" data-pedir-cancelar>Cancelar</button></div>' +
          '<div class="editor-cuerpo" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="ed-' + a.fila + '-cuerpo" data-editar-cuerpo>' +
            (ed.cuerpoNuevo !== null ? ed.cuerpoNuevo : ed.cuerpo) + '</div>' +
        '</div>' +
        '<p class="ayuda">Cita: escribe [[1]] (o «Cita»); la referencia es la línea que empieza con [[1]] («+ Referencia»). Lo pegado de Word o Docs se limpia solo. ' +
          (a.tipo === 'revision' ? 'Al guardar sigue en borrador; se publica con «Publicar».' : 'Al guardar, el cambio se ve en el blog.') + ' «Rehacer desde el Word» reemplaza la ficha y el texto editados.</p></div>') +
  '</div>';
}

// Grupos de [formato, texto del botón, descripción]
var BARRA_EDITOR = [
  [['bold', '<b>N</b>', 'Negrita (Ctrl+B)'], ['italic', '<i>C</i>', 'Cursiva (Ctrl+I)'], ['underline', '<u>S</u>', 'Subrayado (Ctrl+U)']],
  [['h2', 'Título', 'Título de sección'], ['h3', 'Subtítulo', 'Subtítulo'], ['p', 'Normal', 'Texto normal']],
  [['insertUnorderedList', '•&nbsp;Lista', 'Lista con viñetas'], ['insertOrderedList', '1.&nbsp;Lista', 'Lista numerada']],
  [['enlace', 'Enlace', 'Enlace en el texto seleccionado'], ['unlink', 'Quitar&nbsp;enlace', 'Quitar enlace']],
  [['cita', 'Cita&nbsp;[[n]]', 'Insertar cita a una referencia'], ['referencia', '+&nbsp;Referencia', 'Agregar una referencia al final'], ['imagen', 'Imagen', 'Insertar imagen donde está el cursor']],
  [['removeFormat', 'Limpiar', 'Quitar formato del texto seleccionado'], ['deshacer', '↶', 'Deshacer (Ctrl+Z)'], ['rehacer', '↷', 'Rehacer (Ctrl+Y)']]
];
var REFERENCIA_ATRIBUTOS = ' class="articulo-referencia" style="padding-left:2em;text-indent:-2em;"'; // Igual que la conversión (Documento.gs)

/** Lo pegado desde Word, Docs o la web → solo las etiquetas que usa la nota, sin estilos ni clases (Word agrega muchos). */
function limpiarPegado(html) {
  var doc = new DOMParser().parseFromString(html, 'text/html');
  var cambia = { H1: 'h2', H4: 'h3', H5: 'h3', H6: 'h3', B: 'strong', I: 'em', DIV: 'p' };
  var permitidas = /^(P|H2|H3|STRONG|EM|U|A|UL|OL|LI|BR|SUP|SUB)$/;
  (function limpiar(nodo) {
    [].slice.call(nodo.childNodes).forEach(function (n) {
      if (n.nodeType === 8) { n.remove(); return; } // Comentarios de Word
      if (n.nodeType !== 1) return;
      if (/^(STYLE|SCRIPT|META|LINK|TITLE|XML|IMG|svg)$/i.test(n.tagName) || n.tagName.indexOf(':') !== -1) { n.remove(); return; }
      var estilo = n.getAttribute('style') || '';
      if (/mso-list:\s*ignore/i.test(estilo)) { n.remove(); return; } // Viñeta dibujada por Word: la lista ya tiene su texto
      limpiar(n);
      var nombre = cambia[n.tagName] || (permitidas.test(n.tagName) ? n.tagName.toLowerCase() : '');
      // Google Docs: todo va en <b style="font-weight:normal"> y las negritas/cursivas son <span style="…">
      if (n.tagName === 'B' && /font-weight:\s*(normal|400)/i.test(estilo)) nombre = '';
      if (n.tagName === 'SPAN' && /font-weight:\s*(bold|[6-9]00)/i.test(estilo)) nombre = 'strong';
      else if (n.tagName === 'SPAN' && /font-style:\s*italic/i.test(estilo)) nombre = 'em';
      if (nombre === 'a' && !/^(https?:|mailto:)/i.test(n.getAttribute('href') || '')) nombre = ''; // Enlace inválido: solo se deja el texto
      if (!nombre) { n.replaceWith.apply(n, [].slice.call(n.childNodes)); return; } // span, font…: solo se deja el texto
      var nuevo = doc.createElement(nombre);
      var href = n.getAttribute('href');
      if (nombre === 'a') { nuevo.setAttribute('href', href); nuevo.setAttribute('target', '_blank'); nuevo.setAttribute('rel', 'noopener'); }
      while (n.firstChild) nuevo.appendChild(n.firstChild);
      n.replaceWith(nuevo);
    });
  })(doc.body);
  return doc.body.innerHTML;
}

function textoAParrafos(t) {
  return String(t).split(/\r?\n\s*\r?\n|\r?\n/).filter(function (x) { return x.trim(); })
    .map(function (x) { return '<p>' + esc(x) + '</p>'; }).join('');
}

// Última posición del cursor dentro de un editor: los botones y el campo «Aplicar» la necesitan después de mover el foco
var rangoEditor = null;
document.addEventListener('selectionchange', function () {
  var sel = document.getSelection();
  if (sel.rangeCount && sel.anchorNode && sel.anchorNode.parentElement && sel.anchorNode.parentElement.closest('[data-editar-cuerpo]')) rangoEditor = sel.getRangeAt(0).cloneRange();
});

function volverAlEditor(editor) {
  editor.focus();
  if (rangoEditor && editor.contains(rangoEditor.startContainer)) {
    var sel = document.getSelection();
    sel.removeAllRanges();
    sel.addRange(rangoEditor);
  }
}

function edicionDe(nodo) {
  var tarjeta = nodo.closest('.tarjeta');
  return tarjeta && estado.ediciones[tarjeta.getAttribute('data-fila')];
}

/* Historial propio: los botones cambian el texto por código y el deshacer del navegador no los detecta.
   Cada paso guarda el HTML y la posición del cursor (en caracteres desde el inicio). */
function cursorEn(editor) {
  var sel = document.getSelection();
  if (!sel.rangeCount || !editor.contains(sel.anchorNode)) return null;
  var r = document.createRange();
  r.selectNodeContents(editor);
  r.setEnd(sel.getRangeAt(0).endContainer, sel.getRangeAt(0).endOffset);
  return r.toString().length;
}

function ponerCursor(editor, n) {
  if (n === null || n === undefined) return;
  var caminante = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT), t;
  while ((t = caminante.nextNode())) {
    if (n <= t.length) {
      var r = document.createRange();
      r.setStart(t, n); r.collapse(true);
      document.getSelection().removeAllRanges(); document.getSelection().addRange(r);
      return;
    }
    n -= t.length;
  }
}

function instantanea(editor) {
  var ed = edicionDe(editor);
  if (!ed) return;
  clearTimeout(ed.espera);
  var html = editor.innerHTML;
  ed.cuerpoNuevo = html;
  if (ed.historial[ed.paso].html === html) return;
  ed.historial = ed.historial.slice(0, ed.paso + 1).concat([{ html: html, cursor: cursorEn(editor) }]).slice(-100);
  ed.paso = ed.historial.length - 1;
}

function irAlPaso(editor, delta) {
  var ed = edicionDe(editor);
  instantanea(editor); // Lo escrito hace un momento también se puede deshacer
  var destino = ed.paso + delta;
  if (destino < 0 || destino >= ed.historial.length) return;
  ed.paso = destino;
  editor.innerHTML = ed.historial[destino].html;
  ed.cuerpoNuevo = editor.innerHTML;
  editor.focus();
  ponerCursor(editor, ed.historial[destino].cursor);
}

/** Fila «Aplicar» bajo la barra (en lugar de ventanas emergentes): pide un dato y regresa el cursor donde estaba. */
function pedirEnEditor(tarjeta, etiqueta, valor, alAceptar) {
  var caja = tarjeta.querySelector('[data-pedir]'), entrada = caja.querySelector('input');
  caja.querySelector('label').textContent = etiqueta;
  entrada.value = valor || '';
  caja.hidden = false;
  entrada.focus();
  caja.alAceptar = function () {
    var v = entrada.value.trim();
    if (!v) { entrada.focus(); return; }
    caja.hidden = true;
    var editor = tarjeta.querySelector('[data-editar-cuerpo]');
    volverAlEditor(editor);
    alAceptar(v, editor);
    instantanea(editor);
  };
}

function numerosDeReferencia(editor) {
  return (editor.textContent.match(/\[\[\s*\d{1,3}\s*\]\]/g) || []).map(function (m) { return Number(m.replace(/\D/g, '')); });
}

function accionDeFormato(boton) {
  var tarjeta = boton.closest('.tarjeta'), editor = tarjeta.querySelector('[data-editar-cuerpo]'), f = boton.getAttribute('data-formato');
  var ed = estado.ediciones[tarjeta.getAttribute('data-fila')];
  if (f === 'completa') { ed.completa = !ed.completa; pintar(); return; } // El texto y su historial están en estado: no se pierden
  if (!editor) return;
  if (f === 'deshacer' || f === 'rehacer') { irAlPaso(editor, f === 'deshacer' ? -1 : 1); return; }
  instantanea(editor); // Lo escrito antes del botón queda como un paso aparte
  if (f === 'enlace') {
    pedirEnEditor(tarjeta, 'Dirección del enlace (https://…):', 'https://', function (url) {
      if (!/^(https?:\/\/|mailto:)/i.test(url)) { avisar('El enlace debe empezar con https:// o mailto:', true); return; }
      document.execCommand('createLink', false, url);
      editor.querySelectorAll('a[href="' + url.replace(/"/g, '') + '"]').forEach(function (a) { a.target = '_blank'; a.rel = 'noopener'; });
    });
    return;
  }
  if (f === 'cita') {
    var hay = numerosDeReferencia(editor);
    pedirEnEditor(tarjeta, 'Número de la referencia que citas:', hay.length ? String(Math.max.apply(null, hay)) : '1', function (n) {
      if (!/^\d{1,3}$/.test(n)) { avisar('Escribe solo el número, por ejemplo 3.', true); return; }
      document.execCommand('insertText', false, '[[' + n + ']]');
    });
    return;
  }
  if (f === 'imagen') {
    pedirEnEditor(tarjeta, 'Describe la imagen (para quien no puede verla):', '', function (alt) {
      var archivo = tarjeta.querySelector('[data-imagen-nota]');
      archivo.alt = alt;
      archivo.click();
    });
    return;
  }
  if (f === 'referencia') {
    var nums = numerosDeReferencia(editor), n = nums.length ? Math.max.apply(null, nums) + 1 : 1;
    var lineas = [].slice.call(editor.querySelectorAll('p, li')).filter(function (x) { return /^\s*\[\[\s*\d{1,3}\s*\]\]/.test(x.textContent); });
    var ultima = lineas[lineas.length - 1], nueva;
    if (ultima) {
      nueva = ultima.cloneNode(false);
      ultima.after(nueva);
    } else {
      // Sin líneas [[n]]: va al final; el título «Referencias» solo se agrega si la nota no tiene uno
      var conTitulo = [].slice.call(editor.querySelectorAll('h2')).some(function (h) { return /referencias|bibliograf/i.test(h.textContent); });
      editor.insertAdjacentHTML('beforeend', (conTitulo ? '' : '<h2>Referencias</h2>') + '<p' + REFERENCIA_ATRIBUTOS + '></p>');
      nueva = editor.lastElementChild;
    }
    nueva.textContent = '[[' + n + ']] ';
    var r = document.createRange();
    r.selectNodeContents(nueva); r.collapse(false);
    editor.focus();
    document.getSelection().removeAllRanges(); document.getSelection().addRange(r);
    nueva.scrollIntoView({ block: 'nearest' });
    instantanea(editor);
    return;
  }
  volverAlEditor(editor);
  if (f === 'h2' || f === 'h3' || f === 'p') document.execCommand('formatBlock', false, '<' + f + '>');
  else document.execCommand(f, false, null);
  instantanea(editor);
}

document.addEventListener('mousedown', function (e) {

document.addEventListener('click', function (e) {

  if (b && b.closest('.edicion')) { accionDeFormato(b); return; }
  var caja = e.target.closest('[data-pedir]');
  if (caja && e.target.closest('[data-pedir-aceptar]')) caja.alAceptar();
  if (caja && e.target.closest('[data-pedir-cancelar]')) caja.hidden = true;
});

document.addEventListener('paste', function (e) {
  var editor = e.target.closest && e.target.closest('[data-editar-cuerpo]');
  if (!editor) return;
  e.preventDefault();
  instantanea(editor);
  var html = e.clipboardData.getData('text/html');

document.addEventListener('keydown', function (e) {

    if (marco) { estado.ediciones[marco.closest('.tarjeta').getAttribute('data-fila')].completa = false; pintar(); }
    return;
  }
  if (e.key === 'Enter' && e.target.closest && e.target.closest('[data-pedir]')) { e.preventDefault(); e.target.closest('[data-pedir]').alAceptar(); return; }
  var editor = e.target.closest && e.target.closest('[data-editar-cuerpo]');

  if (editor && (e.ctrlKey || e.metaKey) && (tecla === 'z' || tecla === 'y')) {

document.addEventListener('change', function (e) {

    .then(function (id) {

        'style="display:block;max-width:100%;height:auto;max-height:560px;object-fit:contain;margin:0 auto;border-radius:10px;"></p>'); // Igual que imagenHtml_ (Documento.gs)
      instantanea(editor);

/** HTML de la nota → listo para editarse en el panel: se analiza sin ejecutarse y se le quitan scripts y on…= (el servidor vuelve a limpiarlo). */
function htmlLimpio(html) {
  var doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
  doc.querySelectorAll('script,style,object,embed,form,base,meta,link').forEach(function (n) { n.remove(); });
  doc.querySelectorAll('*').forEach(function (n) {
    [].slice.call(n.attributes).forEach(function (at) {
      if (/^on/i.test(at.name) || /^\s*javascript:/i.test(at.value)) n.removeAttribute(at.name);
    });
  });
  return doc.body.firstChild.innerHTML;
}

document.addEventListener('input', function (e) {
  var tarjeta = e.target.closest && e.target.closest('.tarjeta');
  var ed = tarjeta && estado.ediciones[tarjeta.getAttribute('data-fila')];
  if (!ed) return;
  var clave = e.target.getAttribute('data-editar');
  var editor = e.target.closest('[data-editar-cuerpo]');
  if (clave && clave.indexOf('ficha.') === 0) ed.ficha[clave.slice(6)] = e.target.value;
  else if (clave) ed[clave] = e.target.value;
  if (clave) { // La vista previa de la imagen principal muestra el título y la ficha conforme se editan
    var cab = tarjeta.querySelector('.pn-cabecera'), art = articuloDeFila(tarjeta.getAttribute('data-fila'));
    if (cab && art) { cab.innerHTML = cabeceraHtml(cabeceraPortada(art)); ejesPortada(); }
  }
  if (editor) {
    ed.cuerpoNuevo = editor.innerHTML;
    clearTimeout(ed.espera);
    ed.espera = setTimeout(function () { instantanea(editor); }, 700); // Una pausa al escribir = un paso de deshacer

}

// --- Imagen principal ---
// pc: imagen completa (contain) junto al texto de la nota; cel: banner 4:1 recortado (cover). Igual que estiloArticulo_ en Código.gs
var PORTADA_VISTAS = [
  { clave: 'pc', titulo: '1. En computadora (así se ve en la nota)', ajuste: 'contain',
    ayuda: 'La altura la pone el texto; la imagen se ve completa.' },
  { clave: 'cel', titulo: '2. Banner en celular', ajuste: 'cover', css: '4/1',
    ayuda: 'Arriba de la nota, a todo lo ancho.' },
  { clave: 'tar', titulo: '3. Tarjetas (Inicio y listas)', ajuste: 'cover', css: '16/9',
    ayuda: 'En las secciones se ve la franja central.' }
];
var ENCUADRE_DE_VISTA = { pc: 'encuadrePc', cel: 'encuadreCelular', tar: 'encuadreTarjeta' };

/** Recorte 16:9 de las tarjetas, igual que la vista 3 (object-position + acercamiento). '' para GIF: las tarjetas usan la principal. */
function recorteTarjeta(fila, postId) {
  var ed = estado.portadas[fila];
  var fuente = ed.datos ? Promise.resolve(ed.datos) : llamar('imagenDePortada', Number(fila), postId);
  return fuente.then(function (datos) {
    if (!datos || /^data:image\/gif/.test(datos)) return '';
    return new Promise(function (ok, mal) {
      var img = new Image();
      img.onload = function () {
        var W = 1280, H = 720, e = ed.tar;
        var k = Math.max(W / img.naturalWidth, H / img.naturalHeight) * (e.z || 100) / 100;
        var w = img.naturalWidth * k, h = img.naturalHeight * k;
        var c = document.createElement('canvas');
        c.width = W; c.height = H;
        var g = c.getContext('2d');
        g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
        g.drawImage(img, e.x / 100 * (W - w), e.y / 100 * (H - h), w, h); // Empieza en p·(marco − imagen), como en la vista previa
        ok(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = function () { mal(new Error('No se pudo preparar la imagen de las tarjetas.')); };
      img.src = datos;
    });
  });
}

function guardarPortada(fila, postId) {
  var ed = estado.portadas[fila];
  return recorteTarjeta(fila, postId).then(function (t) {
    return llamar('guardarImagenPrincipal', Number(fila), postId, ed.datos, ed.pc, ed.cel, ed.tar, t);
  });
}
var PORTADA_EJES = [['z', 'Tamaño'], ['x', 'Horizontal'], ['y', 'Vertical']];

/** object-position + scale con origen en el mismo punto (igual que estiloArticulo_ en Código.gs). */
function estiloImagenPortada(e) {
  return 'object-position:' + e.x + '% ' + e.y + '%;transform-origin:' + e.x + '% ' + e.y + '%;transform:scale(' + (e.z || 100) / 100 + ')';
}

/** Título, subtítulo, ficha y lectura reales de la nota (cabeceraDeNota) o, mientras llegan, lo que ya tiene el panel. */
function cabeceraPortada(a) {
  var ed = estado.ediciones[a.fila], real = estado.cabeceras[a.postId];
  if (ed) return { titulo: ed.titulo, subtitulo: ed.subtitulo, lectura: (real || {}).lectura || '',
    ficha: ['nombre', 'fecha', 'correo', 'cargo', 'vinculo'].map(function (k) { return ed.ficha[k]; }).filter(Boolean) };
  return real || {
    titulo: a.titulo, subtitulo: a.subtitulo, ficha: [a.autor].filter(Boolean),

function cabeceraHtml(c) {

    (c.lectura ? '<p class="pn-lectura">' + esc(c.lectura) + '</p>' : '');
}

function bloquePortada(a) {
  if (!a.postId || (a.tipo !== 'revision' && a.tipo !== 'publicado')) return '';
  var ed = estado.portadas[a.fila];
  var src = ed ? ed.src : (a.portada ? 'https://drive.google.com/thumbnail?id=' + a.portada + '&sz=w1600' : '');
  var elegir = '<button class="boton secundario" data-accion="portada-elegir" type="button">' + (src ? 'Cambiar imagen' : 'Agregar imagen principal') + '</button>' +
    '<input type="file" accept="image/*" data-portada-archivo="' + a.fila + '" hidden>';
  if (!src) {
    return '<div class="portada falta"><span class="portada-titulo">Imagen principal (obligatoria)</span>' +
      '<p class="ayuda">⚠ Este artículo no tiene imagen principal y no se puede publicar sin ella. Puede ser de cualquier tamaño (JPG, PNG, WebP o GIF).</p>' +

  }
  var vistas = PORTADA_VISTAS.map(function (v) {

    if (v.clave === 'pc') {

    }
    var controles = !ed ? '' : '<div class="portada-controles">' + PORTADA_EJES.map(function (q) {
      var z = q[0] === 'z';
      return '<label for="pr-' + a.fila + v.clave + q[0] + '">' + q[1] + '</label>' +
        '<input type="range" id="pr-' + a.fila + v.clave + q[0] + '" min="' + (z ? 100 : 0) + '" max="' + (z ? 300 : 100) + '" value="' + e[q[0]] + '"' +
        ' data-portada-rango="' + v.clave + '" data-eje="' + q[0] + '">' +
        '<output data-portada-valor="' + v.clave + q[0] + '">' + e[q[0]] + '%</output>';
    }).join('') + '</div>';
    return '<div class="portada-vista" data-vista-clave="' + v.clave + '"><h4>' + v.titulo +
        (ed ? '<button class="boton-mini" data-accion="portada-centrar" data-vista="' + v.clave + '" type="button" title="Centrar y quitar acercamiento">Centrar</button>' : '') + '</h4>' +
      (ed ? '<p class="ayuda">' + v.ayuda + '</p>' : '') + marco + controles + '</div>';
  }).join('');
  if (ed) setTimeout(ejesPortada, 0); // Con el marco ya dibujado se sabe qué ejes se pueden mover
  return '<div class="portada' + (ed ? ' editando' : '') + '"><span class="portada-titulo">Imagen principal' + (ed ? ' · arrastra cada imagen o usa las barras' : '') + '</span>' +
    '<div class="portada-vistas">' + vistas + '</div>' +
    '<div class="fila-botones">' + (estado.ediciones[a.fila] ? elegir : ed
      ? '<button class="boton principal" data-accion="portada-guardar" type="button">' + (a.tipo === 'publicado' ? 'Guardar y publicar' : 'Guardar en el borrador') + '</button>' +
        '<button class="boton secundario" data-accion="portada-cancelar" type="button">Cancelar</button>'
      : '<button class="boton secundario" data-accion="portada-ajustar" type="button">Ajustar imagen</button>' + elegir) +
    '</div></div>';
}

/** Abre el ajuste cuando ya se conoce el tamaño real de la imagen; pide la cabecera real de la nota para la vista previa. */
function abrirPortada(fila, src, datos, pc, cel, postId, tar) {
  var copia = function (e) { return { x: e.x, y: e.y, z: e.z || 100 }; };
  var img = new Image();
  img.onload = function () {
    estado.portadas[fila] = { src: src, datos: datos, nw: img.naturalWidth, nh: img.naturalHeight, pc: copia(pc), cel: copia(cel), tar: copia(tar || { x: 50, y: 50, z: 100 }) };
    pintar();
  };
  img.onerror = function () { avisar('No se pudo cargar la imagen. Recarga el panel e inténtalo de nuevo.', true); };
  img.src = src;
  if (postId && !estado.cabeceras[postId]) {
    llamar('cabeceraDeNota', postId).then(function (c) { estado.cabeceras[postId] = c; pintar(); }, function () { /* Se queda la aproximada */ });
  }
}

/**
 * Cuánto sobra (en px, puede ser negativo) entre el marco y la imagen ya escalada, en cada eje.
 * Con object-position p y scale(z) con origen en p, la imagen empieza en p·(marco − imagen·z):
 * arrastrar Δ px equivale a mover p en Δ / sobra.
 */
function sobraPortada(ed, vista, marco) {
  var v = PORTADA_VISTAS.filter(function (q) { return q.clave === vista; })[0];
  var bw = marco.clientWidth, bh = marco.clientHeight;
  var k = (v.ajuste === 'contain' ? Math.min : Math.max)(bw / ed.nw, bh / ed.nh) * ed[vista].z / 100;
  return { x: bw - ed.nw * k, y: bh - ed.nh * k };
}

/** Desactiva las barras Horizontal/Vertical cuando en ese eje la imagen llena justo el marco (no hay nada que mover). */
function ejesPortada() {
  document.querySelectorAll('.portada.editando .portada-marco').forEach(function (marco) {
    var tarjeta = marco.closest('.tarjeta'), ed = tarjeta && estado.portadas[tarjeta.getAttribute('data-fila')];
    if (!ed) return;
    var vista = marco.getAttribute('data-vista'), sobra = sobraPortada(ed, vista, marco);
    ['x', 'y'].forEach(function (eje) {
      var r = tarjeta.querySelector('[data-portada-rango="' + vista + '"][data-eje="' + eje + '"]');
      if (r) r.disabled = Math.abs(sobra[eje]) < 1;
    });
  });
}

function moverPortada(tarjeta, vista, cambios) {
  var e = estado.portadas[tarjeta.getAttribute('data-fila')][vista];
  Object.keys(cambios).forEach(function (eje) {
    e[eje] = Math.round(Math.max(eje === 'z' ? 100 : 0, Math.min(eje === 'z' ? 300 : 100, cambios[eje])));
    var r = tarjeta.querySelector('[data-portada-rango="' + vista + '"][data-eje="' + eje + '"]');
    if (r) r.value = e[eje];
    var o = tarjeta.querySelector('[data-portada-valor="' + vista + eje + '"]');
    if (o) o.textContent = e[eje] + '%';
  });
  tarjeta.querySelector('.portada-marco[data-vista="' + vista + '"] img').setAttribute('style', estiloImagenPortada(e));
  if ('z' in cambios) ejesPortada();
}

/** Cualquier tamaño → JPEG de máximo 2000 px por lado (lo que necesita el blog y cabe en google.script.run). */
function reducirImagen(archivo) {
  return new Promise(function (ok, mal) {
    if (archivo.type === 'image/gif') { // Sin cambios: el canvas le quitaría la animación
      if (archivo.size > 10 * 1024 * 1024) return mal(new Error('El GIF pesa más de 10 MB. Usa uno más ligero.'));
      var lector = new FileReader();
      lector.onload = function () { ok(lector.result); };
      lector.onerror = function () { mal(new Error('No se pudo leer el GIF.')); };
      return lector.readAsDataURL(archivo);
    }
    var url = URL.createObjectURL(archivo), img = new Image();
    img.onload = function () {
      var k = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
      var c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      var g = c.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); // PNG transparente → fondo blanco
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = function () { URL.revokeObjectURL(url); mal(new Error('No se pudo leer la imagen. Usa JPG, PNG, WebP o GIF.')); };
    img.src = url;
  });
}

// Arrastrar: la imagen sigue al dedo o al mouse, en los dos ejes
document.addEventListener('pointerdown', function (e) {
  var marco = e.target.closest('.portada.editando .portada-marco');
  if (!marco) return;
  var tarjeta = marco.closest('.tarjeta'), vista = marco.getAttribute('data-vista');
  var ed = estado.portadas[tarjeta.getAttribute('data-fila')];
  var sobra = sobraPortada(ed, vista, marco);
  var x0 = e.clientX, y0 = e.clientY, inicio = { x: ed[vista].x, y: ed[vista].y };
  e.preventDefault();
  marco.setPointerCapture(e.pointerId);
  function mover(ev) {
    var c = {};
    if (Math.abs(sobra.x) >= 1) c.x = inicio.x + (ev.clientX - x0) / sobra.x * 100;
    if (Math.abs(sobra.y) >= 1) c.y = inicio.y + (ev.clientY - y0) / sobra.y * 100;
    moverPortada(tarjeta, vista, c);
  }
  function soltar() {
    marco.removeEventListener('pointermove', mover);
    marco.removeEventListener('pointerup', soltar);
    marco.removeEventListener('pointercancel', soltar);
  }
  marco.addEventListener('pointermove', mover);
  marco.addEventListener('pointerup', soltar);
  marco.addEventListener('pointercancel', soltar);
});

// Etiquetas adicionales como chips: el administrador las agrega una por una (Enter)
var ETIQUETAS_MAXIMO = 5, ETIQUETA_LARGO = 30;

function listaEtiquetas(texto) {
  return String(texto || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean);
}

function campoEtiquetas(sugeridas, fila) {
  var guardadas = estado.elecciones['etiquetas-' + fila];
  var lista = listaEtiquetas(guardadas !== undefined ? guardadas : (sugeridas || '')).slice(0, ETIQUETAS_MAXIMO);
  var chips = lista.map(function (x, i) {
    return '<span class="chip">' + esc(x) + '<button type="button" data-quitar-etiqueta="' + i + '" data-fila="' + fila + '" aria-label="Quitar ' + esc(x) + '">×</button></span>';
  }).join('');
  var lleno = lista.length >= ETIQUETAS_MAXIMO;
  return '<div class="campo-seccion">' +
    '<label>Etiquetas adicionales (opcional)</label>' +
    '<div class="chips" data-chips="' + fila + '">' + chips +
      '<input type="text" data-chip-input data-fila="' + fila + '" maxlength="' + ETIQUETA_LARGO + '"' + (lleno ? ' disabled placeholder="Máximo ' + ETIQUETAS_MAXIMO + '"' : ' placeholder="Escribe una etiqueta y presiona Enter"') + '>' +
    '</div>' +
    '<input type="hidden" data-etiquetas data-fila="' + fila + '" value="' + esc(lista.join(', ')) + '">' +
    '<div class="ayuda">Una por una, máximo ' + ETIQUETAS_MAXIMO + '. Sirven para buscar y filtrar notas en el blog.</div>' +
  '</div>';
}

function cambiarEtiquetas(fila, lista) {
  estado.elecciones['etiquetas-' + fila] = lista.join(', ');
  var contenedor = document.querySelector('[data-chips="' + fila + '"]');
  if (!contenedor) return;
  var campo = contenedor.closest('.campo-seccion');
  var temp = document.createElement('div');
  temp.innerHTML = campoEtiquetas('', fila);
  campo.replaceWith(temp.firstChild);
  var entrada = document.querySelector('[data-chip-input][data-fila="' + fila + '"]');
  if (entrada && !entrada.disabled) entrada.focus();
}

function agregarEtiqueta(entrada) {
  var fila = entrada.getAttribute('data-fila');
  var texto = entrada.value.replace(/^\s*#+/, '').replace(/[<>",]/g, '').replace(/\s+/g, ' ').trim().slice(0, ETIQUETA_LARGO);
  if (!texto) return;
  var lista = listaEtiquetas(estado.elecciones['etiquetas-' + fila] || document.querySelector('[data-etiquetas][data-fila="' + fila + '"]').value);
  var repetida = lista.some(function (x) { return x.toLowerCase() === texto.toLowerCase(); });
  if (/^(categoria|formato|facultad)-/i.test(texto)) { avisar('Esa etiqueta es interna del blog; usa otra.', true); return; }
  if (repetida) { entrada.value = ''; return; }
  if (lista.length >= ETIQUETAS_MAXIMO) { avisar('Máximo ' + ETIQUETAS_MAXIMO + ' etiquetas.', true); return; }
  lista.push(texto);
  cambiarEtiquetas(fila, lista);
}

document.addEventListener('keydown', function (e) {
  var entrada = e.target;
  if (!entrada.hasAttribute || !entrada.hasAttribute('data-chip-input')) return;
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    agregarEtiqueta(entrada);
  } else if (e.key === 'Backspace' && !entrada.value) {
    var fila = entrada.getAttribute('data-fila');
    var lista = listaEtiquetas(document.querySelector('[data-etiquetas][data-fila="' + fila + '"]').value);
    if (lista.length) { lista.pop(); cambiarEtiquetas(fila, lista); }
  }
});

document.addEventListener('click', function (e) {
  var boton = e.target.closest && e.target.closest('[data-quitar-etiqueta]');
  if (boton) {
    var fila = boton.getAttribute('data-fila');
    var lista = listaEtiquetas(document.querySelector('[data-etiquetas][data-fila="' + fila + '"]').value);
    lista.splice(Number(boton.getAttribute('data-quitar-etiqueta')), 1);
    cambiarEtiquetas(fila, lista);
    return;
  }
  var caja = e.target.closest && e.target.closest('.chips');
  if (caja) { var entrada = caja.querySelector('[data-chip-input]'); if (entrada && !entrada.disabled) entrada.focus(); }
});
