<script>
(function(){

  var IMAGEN_GENERICA = "data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 800 500%27%3E%3Crect width=%27800%27 height=%27500%27 fill=%27%23e6f2ec%27/%3E%3Cpath d=%27M0 500L800 290V500z%27 fill=%27%2300723f%27 opacity=%27.14%27/%3E%3C/svg%3E";

  // La sección muestra sus notas por la etiqueta de la sección (CONFIG.SECCIONES en Código.js), sin subtítulos por tema
  var etiquetas = { notas: 'categoria-tecnologia-educativa' };

  // Se piden 11: si llega la 11.ª, hay más y aparece «Ver todas las notas» (lleva a la sección en Todas las notas)
  var maximoEntradas = 10;

  function rutaFeed(etiqueta){
    return '/feeds/posts/default/-/' + encodeURIComponent(etiqueta) +
           '?alt=json&orderby=published&max-results=' + (maximoEntradas + 1);
  }


  function quitarEtiquetasHtml(texto){
    var caja = document.createElement('div');
    caja.innerHTML = texto || '';
    return (caja.textContent || '').replace(/\s+/g,' ').trim();
  }

  function recortar(texto,limite){
    if(texto.length <= limite){return texto;}
    return texto.substring(0,limite).replace(/\s+\S*$/,'') + '…';
  }

  function obtenerEnlace(entrada){
    var enlaces = entrada.link || [];
    for(var i=0;i<enlaces.length;i++){
      if(enlaces[i].rel === 'alternate'){return enlaces[i].href;}
    }
    return '#';
  }

  function obtenerImagen(entrada){
    // Panel CIAD (imagenCiad): la imagen de las tarjetas de la nota (o la principal) va antes que la miniatura de Blogger
    var contenidoCiad = entrada.content ? entrada.content.$t || '' : '';
    var imagenCiad = contenidoCiad.match(/\x3cimg[^>]*class="articulo-tarjeta"[^>]*src="([^"]+)"/) || contenidoCiad.match(/\x3cfigure class="articulo-portada"[^>]*>\x3cimg[^>]*src="([^"]+)"/);
    if (imagenCiad) { return imagenCiad[1].replace(/\x26amp;/g, '\x26'); }

    if(entrada.media$thumbnail && entrada.media$thumbnail.url){
      return entrada.media$thumbnail.url.replace(/\/s72-c\//,'/w800-h500-c/');
    }

    var cuerpo = (entrada.content && entrada.content.$t) || '';
    var caja = document.createElement('div');
    caja.innerHTML = cuerpo;
    var imagen = caja.querySelector('img');

    return imagen ? imagen.src : IMAGEN_GENERICA;
  }

  // Texto de la entrada sin la ficha del autor ni estilos, con espacios entre bloques (DEF-017)
  function textoResumen(html){
    var caja = document.createElement('div');
    caja.innerHTML = html || '';
    caja.querySelectorAll('style, script, .articulo-ficha, .articulo-lectura').forEach(function(el){ el.remove(); });
    caja.querySelectorAll('p, h1, h2, h3, h4, li, div, br').forEach(function(el){ el.insertAdjacentText('afterend', ' '); });
    return (caja.textContent || '').replace(/\s+/g, ' ').trim();
  }

  function obtenerResumen(entrada,limite){
    var cuerpo = (entrada.summary && entrada.summary.$t) ||
                 (entrada.content && entrada.content.$t) || '';
    return recortar(textoResumen(cuerpo), limite);
  }

  // Minutos de lectura de la nota (párrafo .articulo-lectura que pone el Panel CIAD); '' si no lo tiene
  function minutosLectura(entrada){
    var m = ((entrada.content && entrada.content.$t) || '').match(/class="articulo-lectura"[^>]*>[^<]*?(\d+)\s*min/);
    return m ? m[1] : '';
  }
  function insigniaLectura(entrada){
    var n = minutosLectura(entrada);
    return n ? '<span class="lectura-tarjeta" title="Lectura de ' + n + ' min"><i class="fa-regular fa-clock" aria-hidden="true"></i> ' + n + ' min</span>' : '';
  }

  function formatearFecha(iso){
    var fecha = new Date(iso);
    if(isNaN(fecha)){return '';}
    return fecha.toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'});
  }

  function crearTarjetaArticulo(entrada){
    var enlace = obtenerEnlace(entrada);
    var articulo = document.createElement('article');
    articulo.className = 'tarjeta-articulo';

    articulo.innerHTML =
      '<img class="imagen-articulo" src="' + obtenerImagen(entrada) + '" alt="" loading="lazy" />' +
      '<div class="contenido-articulo">' +
        '<p class="fecha-articulo">' + formatearFecha(entrada.published.$t) + insigniaLectura(entrada) + '</p>' +
        '<h3 class="titulo-articulo">' + quitarEtiquetasHtml(entrada.title.$t) + '</h3>' +
        '<p class="resumen-articulo">' + obtenerResumen(entrada,130) + '</p>' +
        '<a class="boton-leer" href="' + enlace + '">Leer más</a>' +
      '</div>';

    return articulo;
  }

  function cargarEntradas(clave,idLista,idEstado,idEnlace){
    var etiqueta = etiquetas[clave];
    var lista = document.getElementById(idLista);
    var estado = document.getElementById(idEstado);
    var enlace = document.getElementById(idEnlace);

    if(!lista || !estado){return;}
    if(enlace){enlace.href = '/p/todas-las-notas.html#tecnologia-educativa';}

    fetch(rutaFeed(etiqueta))
      .then(function(respuesta){
        if(!respuesta.ok){throw new Error('Error al cargar el feed');}
        return respuesta.json();
      })
      .then(function(datos){
        var entradas = (datos.feed && datos.feed.entry) || [];
        if(enlace && entradas.length <= maximoEntradas){enlace.style.display = 'none';}
        entradas = entradas.slice(0, maximoEntradas);

        if(!entradas.length){
          estado.textContent = 'Aún no hay entradas publicadas en esta sección.';
          if(enlace){enlace.style.display = 'none';}
          return;
        }

        for(var i=0;i<entradas.length;i++){
          lista.appendChild(crearTarjetaArticulo(entradas[i]));
        }

        estado.style.display = 'none';
      })
      .catch(function(){
        estado.textContent = 'No fue posible cargar las entradas en este momento.';
        if(enlace){enlace.style.display = 'none';}
      });
  }

  cargarEntradas('notas', 'lista-notas', 'estado-notas', 'enlace-notas');

})();
</script>
