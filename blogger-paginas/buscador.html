<script>
//<![CDATA[
(function () {
  var POR_PAGINA = 12;
  var MAXIMO_CON_TEXTO = 150; // con palabra clave se trae un lote y se filtra aquí
  var indiceInicio = 1;
  var resultadosLocales = null; // resultados ya filtrados cuando se busca con texto

  var campoBusqueda   = document.getElementById('campo-busqueda');
  var botonBuscar     = document.getElementById('boton-buscar');
  var botonLimpiar    = document.getElementById('boton-limpiar');
  var botonMas        = document.getElementById('boton-mas');
  var listaResultados = document.getElementById('lista-resultados');
  var resumen         = document.getElementById('resumen-resultados');

  var selectores = [
    document.getElementById('filtro-categoria'),
    document.getElementById('filtro-facultad'),
    document.getElementById('filtro-formato')
  ];
  var temaActivo = ''; // ?tema=<etiqueta>: viene del clic en el tema de una nota
  var avisoTema = document.getElementById('tema-activo');

  // Etiqueta técnica → nombre visible ('categoria-innovacion' → 'Innovación')
  var nombres = {};
  selectores.forEach(function (selector) {
    [].forEach.call(selector.options, function (o) { if (o.value) { nombres[o.value] = o.textContent.trim(); } });
  });

  function etiquetasElegidas() {
    return selectores
      .map(function (selector) { return selector.value; })
      .concat(temaActivo)
      .filter(Boolean);
  }

  function mostrarTema() {
    avisoTema.hidden = !temaActivo;
    if (temaActivo) {
      avisoTema.innerHTML = 'Notas del tema <b>' + limpiarTexto(temaActivo) + '</b> <button type="button">Quitar tema ✕</button>';
    }
  }

  avisoTema.addEventListener('click', function (evento) {
    if (evento.target.tagName === 'BUTTON') { temaActivo = ''; mostrarTema(); buscar(false); }
  });

  // Las opciones sin notas, o de una sección oculta, se ven pero no se pueden elegir.
  // Si un filtro no tiene ninguna opción disponible, se desactiva completo.
  function marcarDisponibles() {
    Promise.all([
      fetch('/feeds/posts/summary?alt=json&max-results=0').then(function (r) { return r.json(); }),
      fetch('/feeds/pages/default?alt=json&max-results=100').then(function (r) { return r.json(); })
    ]).then(function (res) {
      var usadas = (res[0].feed.category || []).map(function (c) { return c.term; });
      var vivas = (res[1].feed.entry || []).map(function (e) {
        var alt = (e.link || []).filter(function (l) { return l.rel === 'alternate'; })[0];
        return alt ? new URL(alt.href).pathname : '';
      });
      var cambio = false;
      selectores.forEach(function (selector) {
        var disponibles = 0;
        [].forEach.call(selector.options, function (o) {
          if (!o.value) { return; }
          var pagina = o.getAttribute('data-pagina');
          var motivo = o.hasAttribute('data-desactivada') || (pagina && vivas.indexOf(pagina) === -1) ? 'desactivada'
                     : usadas.indexOf(o.value) === -1 ? 'sin notas' : '';
          o.disabled = !!motivo;
          o.textContent = nombres[o.value] + (motivo ? ' (' + motivo + ')' : '');
          if (motivo && selector.value === o.value) { selector.value = ''; cambio = true; }
          if (!motivo) { disponibles++; }
        });
        selector.disabled = !disponibles;
        selector.title = disponibles ? '' : 'Todavía no hay notas con este dato.';
      });
      if (cambio) { buscar(false); }
    }).catch(function () {});
  }

  // DEF-016: varias etiquetas van juntas en una sola ruta: /-/etiqueta1/etiqueta2
  // DEF-015: Blogger ignora las etiquetas cuando hay q=, así que con texto se filtra en el navegador
  function construirUrl() {
    var texto = campoBusqueda.value.trim();
    var etiquetas = etiquetasElegidas();

    if (texto) {
      return '/feeds/posts/default?alt=json&max-results=' + MAXIMO_CON_TEXTO +
             '&q=' + encodeURIComponent(texto);
    }

    var ruta = '/feeds/posts/default';
    if (etiquetas.length) {
      ruta += '/-/' + etiquetas.map(encodeURIComponent).join('/');
    }
    return ruta + '?alt=json&max-results=' + POR_PAGINA + '&start-index=' + indiceInicio;
  }

  function tieneEtiquetas(entrada, etiquetas) {
    var propias = (entrada.category || []).map(function (c) { return c.term; });
    return etiquetas.every(function (e) { return propias.indexOf(e) !== -1; });
  }

  function obtenerEnlace(entrada) {
    var enlaces = entrada.link || [];
    for (var i = 0; i < enlaces.length; i++) {
      if (enlaces[i].rel === 'alternate') { return enlaces[i].href; }
    }
    return '#';
  }

  function obtenerContenido(entrada) {
    if (entrada.content) { return entrada.content.$t; }
    if (entrada.summary) { return entrada.summary.$t; }
    return '';
  }

  function obtenerImagen(entrada) {
    // Panel CIAD (imagenCiad): la imagen de las tarjetas de la nota (o la principal) va antes que la miniatura de Blogger
    var contenidoCiad = entrada.content ? entrada.content.$t || '' : '';
    var imagenCiad = contenidoCiad.match(/\x3cimg[^>]*class="articulo-tarjeta"[^>]*src="([^"]+)"/) || contenidoCiad.match(/\x3cfigure class="articulo-portada"[^>]*>\x3cimg[^>]*src="([^"]+)"/);
    if (imagenCiad) { return imagenCiad[1].replace(/\x26amp;/g, '\x26'); }

    if (entrada.media$thumbnail) {
      // Blogger entrega miniaturas de 72px; se pide un tamaño mayor.
      return entrada.media$thumbnail.url.replace('/s72-c/', '/s400/');
    }
    // Si la entrada no generó miniatura, se toma la primera imagen del contenido.
    var encontrada = obtenerContenido(entrada).match(/<img[^>]+src=["']([^"']+)["']/i);
    return encontrada ? encontrada[1] : null;
  }

  // El contenido trae comentarios HTML y etiquetas; se limpian para el extracto.
  function obtenerExtracto(entrada) {
    var texto = obtenerContenido(entrada)
      .replace(/<div class="articulo-ficha"[\s\S]*?<\/div>/gi, ' ') // DEF-017: sin la ficha del autor
      .replace(/<p class="articulo-lectura"[\s\S]*?<\/p>/gi, ' ') // va como insignia junto a la fecha
      .replace(/<!--[\s\S]*?-->/g, ' ')
      .replace(/<style[\s\S]*?<\/style>/gi, ' ')
      .replace(/<script[\s\S]*?<\/script>/gi, ' ')
      .replace(/<[^>]+>/g, ' ')
      .replace(/&nbsp;/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();

    if (!texto) { return ''; }
    return texto.length > 130 ? texto.substring(0, 130).trim() + '...' : texto;
  }

  // Minutos de lectura de la nota (párrafo .articulo-lectura que pone el Panel CIAD); '' si no lo tiene
  function minutosLectura(entrada){
    var m = ((entrada.content && entrada.content.$t) || '').match(/class="articulo-lectura"[^>]*>[^<]*?(\d+)\s*min/);
    return m ? m[1] : '';
  }
  function insigniaLectura(entrada){
    var n = minutosLectura(entrada);
    return n ? '<span class="lectura-tarjeta" title="Lectura de ' + n + ' min"><i class="fa-regular fa-clock" aria-hidden="true"></i> ' + n + ' min</span>' : '';
  }

  function formatearFecha(texto) {
    var fecha = new Date(texto);
    return fecha.toLocaleDateString('es-MX', {
      day: 'numeric', month: 'long', year: 'numeric'
    });
  }

  function limpiarTexto(texto) {
    var caja = document.createElement('div');
    caja.textContent = texto;
    return caja.innerHTML;
  }

  function crearTarjeta(entrada) {
    var tarjeta = document.createElement('article');
    tarjeta.className = 'tarjeta-resultado';

    var imagen   = obtenerImagen(entrada);
    var extracto = obtenerExtracto(entrada);

    // Categoría con su nombre visible; formato y facultad no se muestran; el resto (temas) filtra el buscador
    var etiquetas = (entrada.category || []).map(function (categoria) {
      var termino = categoria.term;
      if (/^categoria-/.test(termino)) {
        return '<a class="etiqueta-categoria" href="?categoria=' + encodeURIComponent(termino) + '">'
             + limpiarTexto(nombres[termino] || termino.replace(/^categoria-/, '').replace(/-/g, ' ')) + '</a>';
      }
      if (/^(formato|facultad)-/.test(termino)) { return ''; }
      return '<a href="?tema=' + encodeURIComponent(termino) + '">' + limpiarTexto(termino) + '</a>';
    }).join('');

    tarjeta.innerHTML =
      (imagen ? '<img class="imagen-resultado" src="' + imagen + '" alt="" loading="lazy" onerror="this.remove()"/>' : '') +
      '<div class="contenido-tarjeta">' +
        '<h3><a href="' + obtenerEnlace(entrada) + '">' + limpiarTexto(entrada.title.$t) + '</a></h3>' +
        '<p class="fecha-resultado">' + formatearFecha(entrada.published.$t) + insigniaLectura(entrada) + '</p>' +
        '<p class="extracto-resultado">' + limpiarTexto(extracto) + '</p>' +
        (etiquetas ? '<div class="etiquetas-resultado">' + etiquetas + '</div>' : '') +
      '</div>';

    return tarjeta;
  }

  function mostrarSinResultados() {
    resumen.textContent = '';
    listaResultados.innerHTML =
      '<p class="mensaje-estado">No encontramos notas con esa búsqueda.<br/>' +
      'Prueba quitando alguno o usando otra palabra clave.</p>';
  }

  function resumenNotas(mostradas, total) {
    if (total === 1) { return '1 nota encontrada.'; }
    return mostradas < total ? 'Mostrando ' + mostradas + ' de ' + total + ' notas.' : total + ' notas encontradas.';
  }

  // Muestra la siguiente página de los resultados filtrados en el navegador
  function mostrarLocales() {
    var pagina = resultadosLocales.slice(indiceInicio - 1, indiceInicio - 1 + POR_PAGINA);
    pagina.forEach(function (entrada) { listaResultados.appendChild(crearTarjeta(entrada)); });

    var mostradas = indiceInicio - 1 + pagina.length;
    resumen.textContent = resumenNotas(mostradas, resultadosLocales.length);
    botonMas.style.display = mostradas < resultadosLocales.length ? 'block' : 'none';
  }

  function buscar(esPaginaNueva) {
    if (!esPaginaNueva) {
      indiceInicio = 1;
      resultadosLocales = null;
      listaResultados.innerHTML = '';
    }

    // Con texto, las páginas siguientes salen del lote ya descargado
    if (esPaginaNueva && resultadosLocales) {
      mostrarLocales();
      return;
    }

    resumen.textContent = 'Buscando...';
    botonMas.style.display = 'none';

    fetch(construirUrl())
      .then(function (respuesta) { return respuesta.json(); })
      .then(function (datos) {
        var feed     = datos.feed || {};
        var entradas = feed.entry || [];
        var total    = feed.openSearch$totalResults
                     ? parseInt(feed.openSearch$totalResults.$t, 10)
                     : entradas.length;

        if (campoBusqueda.value.trim()) {
          var etiquetas = etiquetasElegidas();
          resultadosLocales = entradas.filter(function (entrada) { return tieneEtiquetas(entrada, etiquetas); });
          if (!resultadosLocales.length) { mostrarSinResultados(); return; }
          mostrarLocales();
          actualizarDireccion();
          return;
        }

        if (!entradas.length && indiceInicio === 1) {
          mostrarSinResultados();
          return;
        }

        entradas.forEach(function (entrada) {
          listaResultados.appendChild(crearTarjeta(entrada));
        });

        var mostradas = indiceInicio - 1 + entradas.length;
        resumen.textContent = resumenNotas(mostradas, total);
        botonMas.style.display = mostradas < total ? 'block' : 'none';

        actualizarDireccion();
      })
      .catch(function () {
        resumen.textContent = '';
        listaResultados.innerHTML =
          '<p class="mensaje-estado">No se pudo cargar el contenido. Intenta de nuevo.</p>';
      });
  }

  // Refleja la búsqueda en la URL para que el resultado se pueda compartir.
  function actualizarDireccion() {
    var parametros = new URLSearchParams();

    if (campoBusqueda.value.trim()) {
      parametros.set('q', campoBusqueda.value.trim());
    }

    selectores.forEach(function (selector) {
      if (selector.value) {
        parametros.set(selector.id.replace('filtro-', ''), selector.value);
      }
    });
    if (temaActivo) { parametros.set('tema', temaActivo); }

    var cadena = parametros.toString();
    history.replaceState(null, '', cadena ? '?' + cadena : location.pathname);
  }

  // Lee la URL al cargar: permite que el buscador del header llegue con ?q=texto
  function leerDireccion() {
    var parametros = new URLSearchParams(location.search);

    if (parametros.get('q')) {
      campoBusqueda.value = parametros.get('q');
    }

    selectores.forEach(function (selector) {
      var valor = parametros.get(selector.id.replace('filtro-', ''));
      if (valor) { selector.value = valor; }
    });
    temaActivo = parametros.get('tema') || '';
    mostrarTema();
  }

  botonBuscar.addEventListener('click', function () { buscar(false); });

  campoBusqueda.addEventListener('keydown', function (evento) {
    if (evento.key === 'Enter') { buscar(false); }
  });

  selectores.forEach(function (selector) {
    selector.addEventListener('change', function () { buscar(false); });
  });

  botonLimpiar.addEventListener('click', function () {
    campoBusqueda.value = '';
    selectores.forEach(function (selector) { selector.value = ''; });
    temaActivo = '';
    mostrarTema();
    buscar(false);
  });

  botonMas.addEventListener('click', function () {
    indiceInicio += POR_PAGINA;
    buscar(true);
  });

  leerDireccion();
  buscar(false);
  marcarDisponibles();
})();
//]]>
</script>
